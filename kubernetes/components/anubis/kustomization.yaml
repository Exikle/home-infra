---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./base
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      annotationSelector: "!anubis.frostlink.dev/skip-route-patch"
    patch: |-
      - op: replace
        path: /spec/values/route/app/rules/0/backendRefs
        value:
          - name: ${APP}-anubis
            port: 8080
