---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - path: ./snapshotpolicy-deep.yaml
    target:
      # No `name:` — kustomize matches target.name as a regex, and the literal
      # ${KOPIUR_APP} placeholder contains regex metacharacters that never match.
      # The ./kopiur component contributes exactly one SnapshotPolicy anyway.
      group: kopiur.home-operations.com
      kind: SnapshotPolicy
