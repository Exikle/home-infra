---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${KOPIUR_APP}
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: ignore
spec:
  credentialProjection:
    enabled: true
  mover:
    cache:
      capacity: ${KOPIUR_CACHE_CAPACITY:=2Gi}
      storageClassName: ${KOPIUR_STORAGECLASS:=openebs-zfs}
    inheritSecurityContextFrom:
      # Replay the UID/GID recorded on the backup snapshot. Unlike pvcConsumer
      # this needs no live pod, which is the case that matters during a restore.
      snapshot: {}
  policy:
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      name: ${KOPIUR_APP}
      offset: 0
  target:
    populator: {}
