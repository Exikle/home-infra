---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  certificates:
    clientCASecret: postgres-client-ca
    replicationTLSSecret: postgres-replication-cert
    serverCASecret: root-ca
    serverTLSSecret: postgres-server-cert
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:4587df73024408f5b2be9b4dd6ba2ccee8c9e5dc0c9a87c274c292291cc8a68c
  instances: 1
  managed:
    roles:
      - name: apoci
        ensure: present
        login: true
        superuser: false
        disablePassword: true
      - name: atuin
        ensure: present
        login: true
        superuser: false
        disablePassword: true
      - name: gotosocial
        ensure: present
        login: true
        superuser: false
        disablePassword: true
      - name: mautrix-signal
        ensure: present
        login: true
        superuser: false
        disablePassword: true
      - name: mautrix-whatsapp
        ensure: present
        login: true
        superuser: false
        disablePassword: true
      - name: pooler-rw
        ensure: present
        login: true
        superuser: false
        disablePassword: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: r2-store
  postgresql:
    pg_hba:
      - hostssl all all all cert clientcert=verify-full map=pooler-map
    pg_ident:
      - pooler-map pooler-rw all
  primaryUpdateMethod: switchover
  storage:
    size: 10Gi
    storageClass: openebs-zfs
