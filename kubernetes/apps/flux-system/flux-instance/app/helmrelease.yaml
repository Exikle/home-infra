---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
spec:
  chartRef:
    kind: OCIRepository
    name: flux-instance
  interval: 1h
  values:
    commonAnnotations:
      fluxcd.controlplane.io/reconcileArtifactEvery: 1h
    instance:
      distribution:
        version: "2.x"
        registry: "ghcr.io/fluxcd"
      components:
        - source-controller
        - kustomize-controller
        - helm-controller
        - notification-controller
      cluster:
        networkPolicy: false
      sync:
        kind: OCIRepository
        url: "oci://registry.frostlink.dev/exikle/frostlink"
        ref: "main"
        path: "kubernetes/apps"
      kustomize:
        patches:
          - patch: |-
              - op: add
                path: /spec/patches
                value:
                  - patch: |-
                      apiVersion: kustomize.toolkit.fluxcd.io/v1
                      kind: Kustomization
                      metadata:
                        name: _
                      spec:
                        deletionPolicy: WaitForTermination
                        patches:
                          - patch: |-
                              apiVersion: helm.toolkit.fluxcd.io/v2
                              kind: HelmRelease
                              metadata:
                                name: _
                              spec:
                                install:
                                  crds: CreateReplace
                                  strategy:
                                    name: RetryOnFailure
                                rollback:
                                  cleanupOnFail: true
                                  recreate: true
                                upgrade:
                                  cleanupOnFail: true
                                  crds: CreateReplace
                                  strategy:
                                    name: RemediateOnFailure
                                  remediation:
                                    remediateLastFailure: true
                                    retries: 2
                            target:
                              group: helm.toolkit.fluxcd.io
                              kind: HelmRelease
                        retryInterval: 1m
                    target:
                      group: kustomize.toolkit.fluxcd.io
                      kind: Kustomization
            target:
              group: kustomize.toolkit.fluxcd.io
              kind: Kustomization
              name: flux-system
          - patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --concurrent=10
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --requeue-dependency=5s
            target:
              kind: Deployment
              name: (kustomize-controller|helm-controller|source-controller)
          - patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: all
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          limits:
                            memory: 1Gi
            target:
              kind: Deployment
              name: (kustomize-controller|helm-controller|source-controller)
          - patch: |-
              - op: replace
                path: /spec/template/spec/volumes/0
                value:
                  name: temp
                  emptyDir:
                    medium: Memory
            target:
              kind: Deployment
              name: kustomize-controller
