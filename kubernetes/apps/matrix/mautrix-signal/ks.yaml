---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mautrix-signal
spec:
  targetNamespace: matrix
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/matrix/mautrix-signal/app
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
    - name: postgres-ca
      namespace: cert-manager
    - name: continuwuity
      namespace: matrix
  components:
    - ../../../../components/postgres/csi
  postBuild:
    substitute:
      APP: mautrix-signal
