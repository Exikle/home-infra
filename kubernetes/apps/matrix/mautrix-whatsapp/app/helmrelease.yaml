---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.2.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mautrix-whatsapp
spec:
  chartRef:
    kind: OCIRepository
    name: mautrix-whatsapp
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1337
        runAsGroup: 1337
        fsGroup: 1337
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=dock.mau.dev/mautrix/whatsapp
              repository: dock.mau.dev/mautrix/whatsapp
              tag: v0.2609.0@sha256:e92b5217929622aabfea3cf72b279d1b73790a035a293d7149bcce7ae220b86f
            command:
              - /usr/bin/mautrix-whatsapp
            args:
              - -c=/data/config.yaml
              - -r=/data/registration.yaml
              - -n
            env:
              MAUTRIX_WHATSAPP_DATABASE__URI:
                valueFrom:
                  configMapKeyRef:
                    name: mautrix-whatsapp-postgres
                    key: url
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 29318
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 29318
                  initialDelaySeconds: 10
                  periodSeconds: 10
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 768Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
    externalSecrets:
      app:
        dataFrom:
          - extract:
              key: mautrix-whatsapp
        forceRename: mautrix-whatsapp
        refreshInterval: 1m
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          creationPolicy: Owner
          name: mautrix-whatsapp
          template:
            templateFrom:
              - configMap:
                  items:
                    - key: config.yaml
                    - key: registration.yaml
                  name: mautrix-whatsapp-configmap
    persistence:
      config:
        type: secret
        name: mautrix-whatsapp
        globalMounts:
          - path: /data/config.yaml
            subPath: config.yaml
            readOnly: true
          - path: /data/registration.yaml
            subPath: registration.yaml
            readOnly: true
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        controller: app
        ports:
          appservice:
            port: 29318
