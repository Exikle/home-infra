---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vm-single
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/observability/vm-single/app
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: envoy-gateway
      namespace: network
    - name: kopiur-repository
      namespace: kopiur-system
  postBuild:
    substitute:
      APP: server-volume-victoria-metrics-server-0
      KOPIUR_CAPACITY: 10Gi
  patches:
    - patch: |
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: SnapshotPolicy
        metadata:
          name: server-volume-victoria-metrics-server-0
        spec:
          mover:
            $patch: replace
            cache:
              capacity: 2Gi
              storageClassName: openebs-zfs
            podSecurityContext:
              runAsUser: 65534
              runAsGroup: 65534
              fsGroup: 65534
      target:
        kind: SnapshotPolicy
        name: server-volume-victoria-metrics-server-0
