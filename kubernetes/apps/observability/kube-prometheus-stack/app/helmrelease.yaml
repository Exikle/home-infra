---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    cleanPrometheusOperatorObjectNames: true

    alertmanager:
      enabled: false

    grafana:
      enabled: false

    kubeStateMetrics:
      enabled: true

    nodeExporter:
      enabled: true

    prometheus:
      prometheusSpec:
        evaluationInterval: 1m
        retention: 7d
        retentionSize: 4GB
        securityContext:
          fsGroup: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
        initContainers:
          - name: fix-permissions
            image: busybox:latest
            command: ['sh', '-c', 'chown 65534:65534 /prometheus']
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              capabilities:
                add: ["CHOWN", "DAC_OVERRIDE"]
                drop: ["ALL"]
            volumeMounts:
              - name: prometheus-kube-prometheus-stack-db
                mountPath: /prometheus
                subPath: prometheus-db
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1500Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              resources:
                requests:
                  storage: 5Gi
