---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    fullnameOverride: kps
    cleanPrometheusOperatorObjectNames: true

    defaultRules:
      rules:
        kubeApiserverAvailability: false
        kubeApiserverBurnrate: false

    grafana:
      enabled: false

    # Talos: etcd metrics on port 2381 (HTTP), selector targets kube-apiserver static pods
    kubeEtcd:
      service:
        port: 2381
        targetPort: 2381
        selector:
          component: kube-apiserver
      serviceMonitor:
        scheme: http
        insecureSkipVerify: true

    # Talos: controller-manager cert signed by Talos CA, not k8s CA
    kubeControllerManager:
      serviceMonitor:
        https: true
        insecureSkipVerify: true

    # Talos: scheduler cert signed by Talos CA, not k8s CA
    kubeScheduler:
      serviceMonitor:
        https: true
        insecureSkipVerify: true

    coreDns:
      serviceMonitor:
        relabelings:
          - action: replace
            targetLabel: job
            replacement: coredns

    kubeStateMetrics:
      enabled: true

    nodeExporter:
      enabled: true

    prometheus-node-exporter:
      fullnameOverride: node-exporter
      extraArgs:
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+|etc/nfsmount\.conf)($|/)

    prometheusOperator:
      admissionWebhooks:
        patch:
          enabled: true

    prometheus:
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.frostlink.dev
          parentRefs:
            - name: external-gateway
              namespace: network
              sectionName: https
      prometheusSpec:
        evaluationInterval: 1m
        retention: 7d
        retentionSize: 4GB
        walCompression: true
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        securityContext:
          fsGroup: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1500Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: openebs-zfs
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi

    alertmanager:
      enabled: false

    additionalPrometheusRulesMap:
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      zfs-rules:
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
                expr: node_zfs_zpool_state{state!="online"} > 0
                labels:
                  severity: critical
