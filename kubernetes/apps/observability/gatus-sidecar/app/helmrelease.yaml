---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus-sidecar
spec:
  chartRef:
    kind: OCIRepository
    name: gatus-sidecar
  interval: 1h
  upgrade:
    force: true
  values:
    config:
      existingConfigMap: "{{ .Release.Name }}-configmap"
      items:
        - key: cluster-endpoints.yaml
          path: cluster-endpoints.yaml
        - key: config.yaml
          path: config.yaml
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    gatus:
      delayStartSeconds: "20"
      envFrom:
        - secretRef:
            name: gatus
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/enabled: "false"
      hostnames:
        - "{{ .Release.Name }}.frostlink.dev"
        - status.dcunha.io
      parentRefs:
        - name: external-gateway
          namespace: network
          sectionName: https
    initContainers:
      - name: gatus-sidecar-artemis
        image: ghcr.io/home-operations/gatus-sidecar:0.6.0@sha256:1d3e6b0c50b9addcbbc68b67ab63b10718afcb3a47909f6644a1ee844dd9e6c2
        args:
          - --output=/config/artemis-sidecar.yaml
          - --default-interval=1m
          - --probe-paths=true
          - --log-level=info
          - --enable-httproute
          - --auto-httproute
          - --enable-service
        env:
          - name: KUBECONFIG
            value: /kube/config
          - name: KUBERNETES_SERVICE_HOST
            value: ""
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
          - mountPath: /config
            name: config
          - mountPath: /kube
            name: artemis-kubeconfig
            readOnly: true
    monitoring:
      serviceMonitor:
        enabled: true
    persistence:
      enabled: true
      accessMode: ReadWriteOnce
      size: 1Gi
      storageClass: openebs-zfs
    sidecar:
      kinds:
        httproute:
          auto: true
          enable: true
        service:
          enable: true
    volumes:
      - name: artemis-kubeconfig
        secret:
          secretName: gatus-artemis-kubeconfig
