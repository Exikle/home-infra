---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus-sidecar
spec:
  chartRef:
    kind: OCIRepository
    name: gatus-sidecar
  interval: 1h
  values:
    config:
      existingConfigMap: "{{ .Release.Name }}-configmap"
      items:
        - key: cluster-endpoints.yaml
          path: cluster-endpoints.yaml
        - key: config.yaml
          path: config.yaml
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    gatus:
      delayStartSeconds: "5"
      envFrom:
        - secretRef:
            name: gatus
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/enabled: "false"
      hostnames:
        - gatus.frostlink.dev
        - status.frostlink.dev
      parentRefs:
        - name: external-gateway
          namespace: network
          sectionName: https
    persistence:
      enabled: true
      accessMode: ReadWriteOnce
      size: 1Gi
      storageClass: local-path
    sidecar:
      kinds:
        httproute:
          auto: true
          enable: true
        service:
          enable: true
