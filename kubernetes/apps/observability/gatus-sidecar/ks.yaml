---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gatus-sidecar
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/observability/gatus-sidecar/app
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  dependsOn:
    - name: envoy-gateway
      namespace: network
    - name: kopiur-repository
      namespace: kopiur-system
    - name: onepassword-connect
      namespace: external-secrets
  wait: true
  postBuild:
    substitute:
      APP: gatus-sidecar
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_SNAPSHOT_REF: gatus-sidecar-manual-1
