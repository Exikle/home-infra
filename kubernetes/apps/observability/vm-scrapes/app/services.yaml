---
apiVersion: v1
kind: Service
metadata:
  name: vm-coredns
  labels:
    app.kubernetes.io/name: vm-coredns
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9153
      targetPort: 9153
  selector:
    k8s-app: kube-dns
---
apiVersion: v1
kind: Service
metadata:
  name: vm-controller-manager
  labels:
    app.kubernetes.io/name: vm-controller-manager
spec:
  clusterIP: None
  ports:
    - name: https-metrics
      port: 10257
      targetPort: 10257
  selector:
    component: kube-controller-manager
---
apiVersion: v1
kind: Service
metadata:
  name: vm-scheduler
  labels:
    app.kubernetes.io/name: vm-scheduler
spec:
  clusterIP: None
  ports:
    - name: https-metrics
      port: 10259
      targetPort: 10259
  selector:
    component: kube-scheduler
---
apiVersion: v1
kind: Service
metadata:
  name: vm-etcd
  labels:
    app.kubernetes.io/name: vm-etcd
spec:
  clusterIP: None
  ports:
    - name: http-metrics
      port: 2381
      targetPort: 2381
  selector:
    component: kube-apiserver
