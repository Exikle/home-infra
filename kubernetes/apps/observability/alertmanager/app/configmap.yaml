---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - equal:
          - alertname
          - namespace
        source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
      - equal:
          - alertname
          - namespace
        source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
    route:
      receiver: blackhole
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: pushover
          matchers:
            - severity =~ "warning|critical"
    receivers:
      - name: blackhole
      - name: pushover
        pushover_configs:
          - user_key_file: /etc/secrets/pushover_api_userkey
            token_file: /etc/secrets/pushover_api_token
            title: >-
              [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
            message: |-
              {{ range .Alerts -}}
              *{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ end }}
            send_resolved: true
