---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.2.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alertmanager
spec:
  chartRef:
    kind: OCIRepository
    name: alertmanager
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534

    controllers:
      app:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: quay.io/prometheus/alertmanager
              tag: v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
            args:
              - --config.file=/etc/alertmanager/alertmanager.yaml
              - --storage.path=/alertmanager
            probes:
              liveness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /-/healthy
                    port: 9093
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /-/ready
                    port: 9093
                  initialDelaySeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    persistence:
      config:
        globalMounts:
          - path: /etc/alertmanager
        name: alertmanager-config
        type: configMap
      data:
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /alertmanager
        size: 1Gi
        storageClass: openebs-zfs
        type: persistentVolumeClaim
      tmp:
        globalMounts:
          - path: /tmp
        type: emptyDir

    service:
      app:
        ports:
          http:
            port: 9093
