---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-tunnel
spec:
  chartRef:
    kind: OCIRepository
    name: cloudflare-tunnel
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    configMaps:
      config:
        data:
          config.yaml: |-
            ingress:
              - hostname: "frostlink.dev"
                originRequest:
                  http2Origin: true
                  keepAliveTimeout: 3600s
                  originServerName: frostlink.dev
                  tcpKeepAlive: 7200s
                service: https://external-gateway.{{ .Release.Namespace }}.svc.cluster.local:443
              - hostname: "*.frostlink.dev"
                originRequest:
                  http2Origin: true
                  keepAliveTimeout: 3600s
                  originServerName: frostlink.dev
                  tcpKeepAlive: 7200s
                service: https://external-gateway.{{ .Release.Namespace }}.svc.cluster.local:443
              - hostname: "status.dcunha.io"
                originRequest:
                  http2Origin: true
                  keepAliveTimeout: 3600s
                  originServerName: status.dcunha.io
                  tcpKeepAlive: 7200s
                service: https://external-gateway.{{ .Release.Namespace }}.svc.cluster.local:443
              - service: http_status:404
    controllers:
      cloudflare-tunnel:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/cloudflare/cloudflared
              tag: 2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
            args:
              - tunnel
              - run
            env:
              NO_AUTOUPDATE: true
              TUNNEL_METRICS: 0.0.0.0:8080
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    externalSecrets:
      app:
        dataFrom:
          - extract:
              key: cloudflare-frostlink
        forceRename: cloudflare-tunnel
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: cloudflare-tunnel
          template:
            data:
              TUNNEL_TOKEN: '{{ toJson (dict "a" .CLOUDFLARE_ACCOUNT_TAG "t" .CLOUDFLARE_TUNNEL_ID "s" .CLOUDFLARE_TUNNEL_SECRET) | b64enc }}'
            engineVersion: v2
    persistence:
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/cloudflared/config.yaml
            subPath: config.yaml
    service:
      app:
        ports:
          http:
            port: *port
