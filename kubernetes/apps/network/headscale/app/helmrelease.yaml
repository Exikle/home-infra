---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headscale
spec:
  chartRef:
    kind: OCIRepository
    name: headscale
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault

    controllers:
      headscale:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/juanfont/headscale
              tag: v0.29.5@sha256:780ed2f9e85719a2211277433f2c8afb45105d0d25031949a6848a485f9e216d
            args:
              - serve
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8443
                    scheme: HTTPS
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8443
                    scheme: HTTPS
                  periodSeconds: 10
                  timeoutSeconds: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true

    persistence:
      config:
        type: configMap
        name: headscale-configmap
        globalMounts:
          - path: /etc/headscale/config.yaml
            subPath: config.yaml
            readOnly: true
          - path: /etc/headscale/policy.hujson
            subPath: policy.hujson
            readOnly: true
      data:
        existingClaim: headscale
        globalMounts:
          - path: /var/lib/headscale
      run:
        type: emptyDir
        globalMounts:
          - path: /var/run/headscale
      tls:
        type: secret
        name: frostlink-dev-tls
        globalMounts:
          - path: /etc/headscale/tls
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    service:
      app:
        ports:
          https:
            port: 443
            targetPort: 8443
          metrics:
            port: 9090

    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            interval: 30s
            path: /metrics
