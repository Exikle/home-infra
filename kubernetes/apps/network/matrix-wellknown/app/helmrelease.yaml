---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matrix-wellknown
spec:
  chartRef:
    kind: OCIRepository
    name: matrix-wellknown
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      matrix-wellknown:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/library/caddy
              tag: 2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
            args:
              - caddy
              - run
              - --config
              - /etc/caddy/Caddyfile
              - --adapter
              - caddyfile
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /.well-known/matrix/server
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /.well-known/matrix/server
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
                add:
                  - "NET_BIND_SERVICE"
    persistence:
      caddyfile:
        type: configMap
        name: matrix-wellknown-configmap
        globalMounts:
          - path: /etc/caddy/Caddyfile
            subPath: Caddyfile
            readOnly: true
      config:
        type: emptyDir
        globalMounts:
          - path: /config
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        hostnames:
          - frostlink.dev
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /.well-known/matrix/server
              - path:
                  type: Exact
                  value: /.well-known/matrix/client
            backendRefs:
              - identifier: app
                port: 8080
    service:
      app:
        controller: matrix-wellknown
        ports:
          http:
            port: 8080
