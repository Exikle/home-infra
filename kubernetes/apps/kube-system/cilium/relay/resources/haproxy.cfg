global
  log stdout format raw local0
  maxconn 256

defaults
  mode tcp
  log global
  timeout connect 5s
  timeout client 1h
  timeout server 1h

frontend clustermesh
  bind :12379
  default_backend clustermesh-apiserver

backend clustermesh-apiserver
  server apiserver clustermesh-apiserver.kube-system.svc.cluster.local:2379 check init-addr last,libc,none
