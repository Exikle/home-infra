---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    bpf:
      masquerade: true
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    cluster:
      id: 2
      name: frostlink-vps
    clustermesh:
      cacheTTL: 15m
      config:
        clusters:
          artemis-cluster:
            ips: ["10.10.99.93"]
            port: 2379
          frostlink-vps:
            ips: ["10.0.0.203"]
            port: 12379
        domain: mesh.cilium.io
        enabled: true
      useAPIServer: true
    cni:
      exclusive: false
    devices: enp0s6
    hubble:
      enabled: false
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: 10.244.0.0/24
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    MTU: 1500
    operator:
      replicas: 1
    rollOutCiliumPods: false
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    sysctlfix:
      enabled: false
  valuesFrom:
    - kind: Secret
      name: cilium-clustermesh-ca
      valuesKey: ca.crt
      targetPath: tls.ca.cert
    - kind: Secret
      name: cilium-clustermesh-ca
      valuesKey: ca.key
      targetPath: tls.ca.key
