---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: atuin
spec:
  chartRef:
    kind: OCIRepository
    name: atuin
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      atuin:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/atuinsh/atuin
              tag: 18.20.1@sha256:ff9a5c426bb6df99adbc09505182d5aed1524d123f973c40b18de56d25c3562a
            args: ["start"]
            env:
              # Cert-based auth against the shared CNPG cluster. sqlx (which
              # atuin uses) accepts the libpq sslcert/sslkey/sslrootcert names
              # this DSN carries, so no password is involved — the role is
              # created with disablePassword.
              ATUIN_DB_URI:
                valueFrom:
                  configMapKeyRef:
                    name: atuin-postgres
                    key: url
              ATUIN_HOST: "0.0.0.0"
              # MUST stay false. This cluster has only external-gateway, so
              # atuin is published publicly and open registration would let
              # anyone create an account. Flip true only long enough to run
              # `atuin register`, then back.
              ATUIN_OPEN_REGISTRATION: "false"
              # atuin's own default. Upstream home-ops binds 80, which only
              # works because Kubernetes defaults
              # net.ipv4.ip_unprivileged_port_start=0 — with runAsUser 1000 and
              # every capability dropped, a high port avoids depending on that.
              ATUIN_PORT: &port 8888
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    persistence:
      # No PVC: history lives in the shared Postgres cluster, which is backed
      # up by the barman-cloud plugin. The postgres/cert component adds the
      # cert mounts.
      #
      # atuin writes a default server.toml on every start and aborts if it
      # cannot, so /config has to be writable even with an external database.
      # Ephemeral is correct here — every real setting comes from env, and the
      # file is regenerated on each start.
      config:
        type: emptyDir
        globalMounts:
          - path: /config
      # readOnlyRootFilesystem is set, so anything writing outside /config
      # needs somewhere to go.
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        hostnames:
          - atuin.frostlink.dev
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    service:
      app:
        ports:
          http:
            port: *port
