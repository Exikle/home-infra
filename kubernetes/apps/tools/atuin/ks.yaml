---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app atuin
spec:
  targetNamespace: tools
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/tools/atuin/app
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  wait: true
  dependsOn:
    - name: envoy-gateway
      namespace: network
    - name: postgres-ca
      namespace: cert-manager
  components:
    - ../../../../components/postgres/cert
  postBuild:
    substitute:
      APP: *app
      POSTGRES_CERT_ENCODING: PKCS8
