---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  chartRef:
    kind: OCIRepository
    name: tuppr
  interval: 1h
  values:
    controller:
      logLevel: info
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      # No Grafana on Frostlink — VictoriaMetrics only, and no grafana-operator CRDs.
      dashboards:
        enabled: false
    # Steady state is ~77Mi, so the initial 128Mi limit OOMKilled the controller during
    # informer sync (exit 137) before it ever reached ready. Request covers steady state;
    # the limit is deliberately generous — an OOM mid-Talos-upgrade is the worst case.
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 512Mi
