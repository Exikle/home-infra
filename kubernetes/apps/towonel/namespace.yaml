---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.36.0/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: _
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # The towonel edge is a hostNetwork DaemonSet binding host ports 443/80,
    # which `baseline` forbids. It lives in its own namespace so `network`
    # (envoy-gateway, cloudflared, external-dns) stays at baseline.
    pod-security.kubernetes.io/enforce: privileged
