---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app towonel
spec:
  targetNamespace: towonel
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/towonel/towonel/app
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: towonel
  postBuild:
    substitute:
      APP: *app
      # Reserved OCI public IP. Not a secret — it is already recorded in
      # AGENTS.md and is the talosconfig endpoint; DNS publishes it anyway.
      FROSTLINK_PUBLIC_IP: 40.233.88.33
      KOPIUR_APP: *app
      # The node writes only node.key, hub_kek.key, invite_hash.key and the
      # sqlite hub DB here. 1Gi is already an order of magnitude of headroom.
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_CACHE_CAPACITY: 1Gi
