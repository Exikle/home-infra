---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app towonel
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    global:
      fullnameOverride: *app

    # Hub and edge share one process. On a single node there is no second node
    # to place a separate edge on, and the split only exists to run edges in
    # other regions.
    hub:
      enabled: true
      # Bound on the host (hostNetwork), but NOT reachable from the internet:
      # TCP 8443 is deliberately closed on the OCI security list. Without
      # TOWONEL_HUB_TLS_ACME_EMAIL the hub speaks plain HTTP, and ACME
      # TLS-ALPN-01 cannot answer on 8443 anyway because the edge owns :443.
      # Public access is via the HTTPRoute below, where Envoy terminates TLS
      # with the existing *.frostlink.dev certificate.
      apiPort: 8443
    edge:
      enabled: true
      httpsPort: 443
      httpPort: 80
      dataDir: /data

    controllers:
      main:
        containers:
          main:
            env:
              # Where agents are told to reach the control plane. Goes through
              # cloudflared + Envoy, not the raw 8443 listener.
              TOWONEL_HUB_PUBLIC_URL: https://hub.frostlink.dev
              # Where agents dial the edge. Must be the DNS-only A record.
              TOWONEL_EDGE_ADVERTISED_ADDRESSES: edge.frostlink.dev:443
              TOWONEL_EDGE_IROH_PORT: "51820"
              # sqlite, not the CNPG cluster, on purpose:
              # .agents/references/towonel.md explains why.
              TOWONEL_HUB_DB_DRIVER: sqlite
            # The chart's derived probes use timeoutSeconds: 1, the same too-tight
            # setting that let a brief Postgres blip kill the mautrix bridges.
            # Liveness should catch deadlock, not a slow moment.
            probes:
              liveness:
                spec:
                  timeoutSeconds: 5
                  periodSeconds: 30
                  failureThreshold: 6
              readiness:
                spec:
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi

    persistence:
      data:
        # `type` is required, not just existingClaim: templates/_config.tpl
        # forces emptyDir unless persistence.data.type is set, and an emptyDir
        # regenerates node.key, hub_kek.key and invite_hash.key on every
        # restart — which would invalidate every outstanding invite.
        # The chart supplies globalMounts at edge.dataDir; do not add mounts
        # here or the volume is mounted twice.
        type: persistentVolumeClaim
        existingClaim: *app

    # Hub control-plane API, published through the Cloudflare tunnel.
    route:
      hub:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: "http://towonel.towonel.svc.cluster.local:8443/v1/readyz"
            conditions: ["[STATUS] == 200"]
            client:
              dns-resolver: ""
        hostnames:
          - hub.frostlink.dev
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: 8443

    service:
      main:
        controller: main
        primary: true
        type: ClusterIP

    serviceMonitor:
      main:
        enabled: true

    monitoring:
      prometheusRule:
        # vm-operator converts this to a VMRule; vmalert selects all of them.
        enabled: true
      dashboards:
        # No Grafana in this cluster.
        enabled: false
