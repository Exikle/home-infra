---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  values:
    features:
      credentialProjection:
        enabled: true
    monitoring:
      prometheusRule:
        enabled: true
        # Backups run hourly, so the 48h chart default is far too loose.
        backupStaleAfterSeconds: 21600 # 6h
      serviceMonitor:
        enabled: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    rbac:
      # ClusterRole for the `kubectl kopiur ls/cat/download/browse` data-plane.
      # Grants no access to Secrets; bind it separately.
      browseRole: true
    webhook:
      serviceMonitor:
        enabled: true
