---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-r2
spec:
  dataFrom:
    - extract:
        key: cloudflare-frostlink
    # KOPIA_PASSWORD for THIS cluster's R2 repository. The `-frostlink` suffix
    # is load-bearing: the 1Password item plainly named `kopiur` belongs to
    # Artemis, and pointing here at that one syncs cleanly, then fails only at
    # connect time with `invalid repository password`. A kopia repository
    # cannot be opened without its original password and does not store it, so
    # a wrong-but-valid-looking value here is unrecoverable. Never repoint this
    # key without first checking the candidate opens the repository.
    - extract:
        key: kopiur-frostlink
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kopiur-r2-secret
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .CLOUDFLARE_R2_ACCESS_KEY }}"
        AWS_SECRET_ACCESS_KEY: "{{ .CLOUDFLARE_R2_SECRET_ACCESS_KEY }}"
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
