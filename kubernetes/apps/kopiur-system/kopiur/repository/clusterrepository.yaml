---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: r2
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-r2-secret
          namespace: kopiur-system
      bucket: frostlink-kopiur
      endpoint: cb8e9b25dc436d997f232269a3597c61.r2.cloudflarestorage.com
      region: auto
  create:
    enabled: true
  credentialProjection:
    allowed: true
  deletionProtection:
    # Hold external destructive Snapshot deletions once this many pile up, until
    # acknowledged with the kopiur.home-operations.com/allow-mass-deletion
    # annotation. Matches the CRD default; pinned here so it stays visible.
    threshold: 10
  encryption:
    passwordSecretRef:
      key: KOPIA_PASSWORD
      name: kopiur-r2-secret
      namespace: kopiur-system
  health:
    probe:
      # Periodically re-connect to R2 so a wiped or unreachable bucket surfaces
      # on its own instead of at restore time. Off by default.
      enabled: true
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: namespace + '-' + policyName
  maintenance:
    namespace: kopiur-system
  moverDefaults:
    cache:
      capacity: 2Gi
      mode: Ephemeral
      storageClassName: openebs-zfs
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    ttlSecondsAfterFinished: 300
  scheduleDefaults:
    # Inherited by verification, replication and maintenance crons only —
    # SnapshotSchedule sets its own timezone.
    timezone: America/Toronto
