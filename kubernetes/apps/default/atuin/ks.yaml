---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app atuin
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/default/atuin/app
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  wait: true
  dependsOn:
    - name: envoy-gateway
      namespace: network
    - name: kopiur-repository
      namespace: kopiur-system
  components:
    - ../../../../components/kopiur
  postBuild:
    substitute:
      APP: *app
      KOPIUR_APP: *app
      # The history database is text-only and compresses well; 5Gi is the
      # component default and is generous for a shell history.
      KOPIUR_CAPACITY: 5Gi
