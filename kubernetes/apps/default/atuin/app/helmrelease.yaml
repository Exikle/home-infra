---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: atuin
spec:
  chartRef:
    kind: OCIRepository
    name: atuin
  interval: 1h
  values:
    controllers:
      atuin:
        containers:
          app:
            image:
              repository: ghcr.io/atuinsh/atuin
              tag: 18.18.1@sha256:8573bcd8343325e3de6f8322787881faeb9e82bee703b5969a55005b69d62e24
            env:
              ATUIN_HOST: "0.0.0.0"
              # atuin's own default. Upstream home-ops binds 80, which only
              # works because Kubernetes defaults
              # net.ipv4.ip_unprivileged_port_start=0 — with runAsUser 1000 and
              # every capability dropped, a high port avoids depending on that.
              ATUIN_PORT: &port 8888
              # MUST stay false. frostlink has only external-gateway, so this
              # is served publicly at atuin.frostlink.dev — open registration
              # would let anyone create an account on it. Flip to "true" only
              # long enough to run `atuin register`, then back.
              ATUIN_OPEN_REGISTRATION: "false"
              ATUIN_DB_URI: sqlite:///config/atuin.db
            args: ["start"]
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - atuin.frostlink.dev
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      # Claim is created by the kopiur component as ${KOPIUR_APP}, which also
      # wires up the snapshot schedule and restore source.
      config:
        existingClaim: atuin
      # readOnlyRootFilesystem is on, so anything writing outside /config needs
      # somewhere to go.
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
