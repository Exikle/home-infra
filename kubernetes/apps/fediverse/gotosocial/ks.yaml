---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gotosocial
spec:
  targetNamespace: fediverse
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/fediverse/gotosocial/app
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gotosocial
      namespace: fediverse
  components:
    - ../../../../components/kopiur
    - ../../../../components/kopiur-deep-verify
    - ../../../../components/postgres/csi
  postBuild:
    substitute:
      APP: gotosocial
      KOPIUR_APP: gotosocial
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_DEEP_VERIFY_CAPACITY: 10Gi
