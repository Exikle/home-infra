---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: phanpy
spec:
  chartRef:
    kind: OCIRepository
    name: phanpy
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101

    controllers:
      phanpy:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jjgadgets/phanpy
              tag: 2026.01.31.8b98d5a@sha256:dc40489af8056ff6aa3c390913f06346504a1f2a91297d503f4310a3b4bd43ee
            env:
              PHANPY_DEFAULT_INSTANCE: social.frostlink.dev
              PHANPY_WEBSITE: https://phanpy.frostlink.dev
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi

    persistence:
      cache:
        type: emptyDir
        advancedMounts:
          phanpy:
            app:
              - path: /tmp
                subPath: tmp
              - path: /data
                subPath: data
              - path: /config
                subPath: config

    route:
      app:
        hostnames:
          - phanpy.frostlink.dev
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080

    service:
      app:
        ports:
          http:
            port: 8080
