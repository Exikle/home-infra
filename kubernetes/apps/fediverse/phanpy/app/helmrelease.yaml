---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.2.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: phanpy
spec:
  chartRef:
    kind: OCIRepository
    name: phanpy
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101

    controllers:
      phanpy:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jjgadgets/phanpy
              tag: 2026.10.05.37be10b@sha256:a1a8598cae5f73ba9d9798b526e5d8ca58fb5246d08cfbacc7d9175fd5b7ef36
            env:
              PHANPY_DEFAULT_INSTANCE: social.frostlink.dev
              PHANPY_WEBSITE: https://phanpy.frostlink.dev
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi

    persistence:
      cache:
        type: emptyDir
        advancedMounts:
          phanpy:
            app:
              - path: /tmp
                subPath: tmp
              - path: /data
                subPath: data
              - path: /config
                subPath: config

    route:
      app:
        hostnames:
          - phanpy.frostlink.dev
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080

    service:
      app:
        ports:
          http:
            port: 8080
