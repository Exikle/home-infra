---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app apoci
spec:
  targetNamespace: fediverse
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/fediverse/apoci/app
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: apoci
      namespace: fediverse
  dependsOn:
    - name: envoy-gateway
      namespace: network
    - name: kopiur-repository
      namespace: kopiur-system
    - name: onepassword-connect
      namespace: external-secrets
    - name: postgres-ca
      namespace: cert-manager
  components:
    - ../../../../components/kopiur
    - ../../../../components/postgres/cert
  postBuild:
    substitute:
      APP: apoci
      KOPIUR_APP: apoci-data
      KOPIUR_CAPACITY: 20Gi
      # Registry blobs are content-addressed and effectively immutable, so
      # hourly snapshots bought almost nothing over 6-hourly. Retention is left
      # at the component default, which still lands around 30 restore points.
      KOPIUR_SCHEDULE: H */6 * * *
