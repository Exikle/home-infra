---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: apoci
spec:
  chartRef:
    kind: OCIRepository
    name: apoci
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      apoci:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: registry.erwanleboucher.dev/eleboucher/apoci
              tag: 0.0.50@sha256:6ceb196e16e00d7e61e3d3f1193ba4393902b4f7b6b9db6e19aa69aaa158ad1b
            env:
              APOCI_DATA_DIR: /data
              APOCI_DB_DSN:
                valueFrom:
                  configMapKeyRef:
                    name: apoci-postgres
                    key: url
            envFrom:
              - secretRef:
                  name: apoci
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsGroup: 1000
              runAsUser: 1000

    persistence:
      data:
        existingClaim: apoci-data
        advancedMounts:
          apoci:
            app:
              - path: /data
      config:
        type: configMap
        name: apoci-config
        advancedMounts:
          apoci:
            app:
              - path: /apoci/config/apoci.yaml
                subPath: apoci.yaml
      tmpfs:
        type: emptyDir
        advancedMounts:
          apoci:
            app:
              - path: /tmp

    route:
      app:
        annotations:
          fingerjoin.naktis.eu/webfinger: "true"
          gatus.home-operations.com/endpoint: |-
            name: apoci
        hostnames:
          - registry.frostlink.dev
        parentRefs:
          - name: external-gateway
            namespace: network
    service:
      app:
        ports:
          http:
            port: 5000
          metrics:
            port: 9090
