---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: apoci-data
spec:
  copyMethod: Snapshot
  credentialProjection:
    enabled: true
  mover:
    cache:
      capacity: 2Gi
      storageClassName: openebs-zfs
  repository:
    kind: ClusterRepository
    name: r2
  retention:
    keepDaily: 7
    keepHourly: 24
  sources:
    - pvc:
        name: apoci-data
  volumeSnapshotClassName: zfs-snapshotclass
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: apoci-pgdata
spec:
  copyMethod: Snapshot
  credentialProjection:
    enabled: true
  mover:
    cache:
      capacity: 2Gi
      storageClassName: openebs-zfs
    securityContext:
      runAsGroup: 999
      runAsNonRoot: true
      runAsUser: 999
  repository:
    kind: ClusterRepository
    name: r2
  retention:
    keepDaily: 7
    keepHourly: 24
  sources:
    - pvc:
        name: apoci-pgdata
  volumeSnapshotClassName: zfs-snapshotclass
