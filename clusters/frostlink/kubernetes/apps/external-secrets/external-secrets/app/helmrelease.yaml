---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  chartRef:
    kind: OCIRepository
    name: external-secrets
  interval: 1h
  values:
    image:
      repository: &image ghcr.io/external-secrets/external-secrets
    installCRDs: true
    serviceMonitor: &probe
      enabled: false
    webhook:
      image:
        repository: *image
      serviceMonitor: *probe
    certController:
      image:
        repository: *image
      serviceMonitor: *probe
