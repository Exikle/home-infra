---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: apoci
spec:
  chartRef:
    kind: OCIRepository
    name: apoci
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      apoci:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: git.ow-ops.eu/ow-ops/apoci
              tag: 0.0.57@sha256:99af34a259d0ee4c217919471e4a3b95e6874465dee97499292a956e20bbffcf
            env:
              APOCI_DATA_DIR: /data
              APOCI_DB_DSN:
                valueFrom:
                  configMapKeyRef:
                    name: apoci-postgres
                    key: url
            envFrom:
              - secretRef:
                  name: apoci
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsGroup: 1000
              runAsUser: 1000

    externalSecrets:
      app:
        dataFrom:
          - extract:
              key: apoci
        forceRename: apoci
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: apoci
          template:
            data:
              APOCI_ADMIN_TOKEN: "{{ .ADMIN_TOKEN }}"
              APOCI_REGISTRY_TOKEN: "{{ .REGISTRY_TOKEN }}"

    persistence:
      data:
        existingClaim: apoci-data
        advancedMounts:
          apoci:
            app:
              - path: /data
      config:
        type: configMap
        name: apoci-config
        advancedMounts:
          apoci:
            app:
              - path: /apoci/config/apoci.yaml
                subPath: apoci.yaml
      tmpfs:
        type: emptyDir
        advancedMounts:
          apoci:
            app:
              - path: /tmp

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: apoci
        hostnames:
          - registry.frostlink.dev
        parentRefs:
          - name: external-gateway
            namespace: network
    service:
      app:
        annotations:
          fingerjoin.naktis.eu/webfinger: "true"
        ports:
          http:
            port: 5000
          metrics:
            port: 9090
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
