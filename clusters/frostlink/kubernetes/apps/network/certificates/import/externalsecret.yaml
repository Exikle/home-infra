---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frostlink-dev-tls
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: frostlink-dev-tls
    creationPolicy: Orphan
    template:
      type: kubernetes.io/tls
      metadata:
        annotations:
          cert-manager.io/alt-names: "*.frostlink.dev,frostlink.dev"
          cert-manager.io/certificate-name: frostlink.dev
          cert-manager.io/common-name: frostlink.dev
          cert-manager.io/ip-sans: ""
          cert-manager.io/issuer-group: ""
          cert-manager.io/issuer-kind: ClusterIssuer
          cert-manager.io/issuer-name: letsencrypt-production
          cert-manager.io/uri-sans: ""
        labels:
          controller.cert-manager.io/fao: "true"
  dataFrom:
    - extract:
        key: frostlink-dev-tls
        decodingStrategy: Base64
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dcunha-io-tls
spec:
  dataFrom:
    - extract:
        key: dcunha-io-tls
        decodingStrategy: Base64
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dcunha-io-tls
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: '{{ index . "tls.crt" }}'
        tls.key: '{{ index . "tls.key" }}'
