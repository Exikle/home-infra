---
alerting:
  pushover:
    application-token: ${PUSHOVER_TOKEN}
    default-alert:
      description: health-check failed
      failure-threshold: 3
      minimum-reminder-interval: 1h
      send-on-resolved: true
      success-threshold: 2
    priority: 1
    resolved-priority: 0
    title: Gatus | Frostlink
    user-key: ${PUSHOVER_USER_KEY}

endpoints:
  - name: ping
    group: core
    url: icmp://${DDNS_HOSTNAME}
    interval: 1m
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: pushover

  - name: home-link
    group: core
    url: tcp://10.10.99.1:443
    interval: 1m
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: pushover

  - name: status-page
    group: core
    url: https://status.dcunha.io
    interval: 1m
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: pushover

  - name: headscale
    group: core
    url: https://headscale.frostlink.dev/health
    interval: 1m
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: pushover

  - name: MCP Ops
    group: cortex
    url: https://ai.dcunha.io/ops/mcp
    method: POST
    interval: 10m
    client:
      dns-resolver: tcp://10.10.99.1:53
      timeout: 15s
    headers:
      x-api-key: ${MCP_OPS_KEY}
      Content-Type: application/json
      Accept: application/json, text/event-stream
    body: '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"gatus","version":"1"}}}'
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"
      - '[BODY] == pat(*"serverInfo"*)'
    alerts:
      - type: pushover

  - name: MCP General
    group: cortex
    url: https://ai.dcunha.io/general/mcp
    method: POST
    interval: 10m
    client:
      dns-resolver: tcp://10.10.99.1:53
      timeout: 15s
    headers:
      x-api-key: ${MCP_GENERAL_KEY}
      Content-Type: application/json
      Accept: application/json, text/event-stream
    body: '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"gatus","version":"1"}}}'
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"
      - '[BODY] == pat(*"serverInfo"*)'
    alerts:
      - type: pushover

external-endpoints:
  - name: heartbeat
    group: core
    token: ${HEARTBEAT_TOKEN}
    heartbeat:
      interval: 5m
    alerts:
      - type: pushover

  - name: artemis
    group: core
    token: ${HEARTBEAT_ARTEMIS_TOKEN}
    heartbeat:
      interval: 5m
    alerts:
      - type: pushover

  - name: frostlink
    group: core
    token: ${HEARTBEAT_FROSTLINK_TOKEN}
    heartbeat:
      interval: 5m
    alerts:
      - type: pushover
