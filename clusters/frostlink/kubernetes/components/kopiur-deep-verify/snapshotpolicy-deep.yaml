---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${KOPIUR_APP}
spec:
  verification:
    deep:
      capacity: ${KOPIUR_DEEP_VERIFY_CAPACITY:=5Gi}
      storageClassName: ${KOPIUR_STORAGECLASS:=openebs-zfs}
      schedule:
        cron: H 5 1 * *
        jitter: 1h
