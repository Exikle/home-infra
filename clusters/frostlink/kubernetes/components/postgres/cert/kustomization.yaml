---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ../base/patch
resources:
  - ./certificate.yaml
  - ../base/configmap.yaml
  - ../base/ks.yaml
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      version: v2
      annotationSelector: "!postgres.frostlink.dev/skip-cert-patch"
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: not-used
      spec:
        values:
          persistence:
            postgres-certs:
              type: secret
              name: "postgres-{{ .Release.Name }}-cert"
              defaultMode: 0600
              globalMounts:
                - path: /var/run/secrets/postgresql
