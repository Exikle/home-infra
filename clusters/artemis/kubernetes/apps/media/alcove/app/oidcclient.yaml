---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: alcove
spec:
  allowedUserGroups:
    - name: app-users
      namespace: security
  callbackUrls:
    - "https://alcove.dcunha.io/auth/oidc/callback"
  clientID: alcove
  launchUrl: "https://alcove.dcunha.io"
  logo:
    autoGenerate: false
  pkceEnabled: true
  secret:
    keys:
      clientID: ALCOVE_OIDC_CLIENT_ID
      clientSecret: ALCOVE_OIDC_CLIENT_SECRET
    storeClientSecret: true
