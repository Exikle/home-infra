min_version = "2026.11.8"

monorepo_root = true

include = [
  "git::https://git.dcunha.io/exikle/mise-config.git//base.toml?ref=3f44a7a137172d56c08789fbe7c62ee6e7fa3c30",
  "git::https://git.dcunha.io/exikle/mise-config.git//cluster.toml?ref=3f44a7a137172d56c08789fbe7c62ee6e7fa3c30",
]

[monorepo]
config_roots = [
  "ai",
  "ansible",
  "kube/clusters/*",
  "kube/clusters/*/bootstrap",
  "kube/clusters/*/talos",
  "terraform",
]

[env]
_.file = { path = "{{config_root}}/.env", redact = true }
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"
ANSIBLE_CONFIG = "{{config_root}}/ansible/ansible.cfg"
ANSIBLE_INVENTORY = "{{config_root}}/ansible/inventory/hosts.yml"
ANSIBLE_ROLES_PATH = "{{config_root}}/ansible/roles"
ANSIBLE_COLLECTIONS_PATH = "{{config_root}}/ansible/collections"
FORGEJO_HOST = "git.dcunha.io"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
FLATE_DISABLE_CHART_DIGEST_TRACKING = "true"

[settings]
lockfile = false
task.quiet = true

[task_config]
cascade = true
shell = "bash -euo pipefail -c"

[tasks.log]
hide = true
run = "gum log -t rfc3339 -s -l"

[tasks.template]
hide = true
dir = "{{ cwd }}"
usage = '''
arg "<file>" help="Template path, or - for stdin"
arg "[args]" var=#true help="Extra arguments for minijinja-cli"
'''
run = '''
eval "args=(${usage_args:-})"
minijinja-cli "$usage_file" "${args[@]}" | op inject
'''

[tasks."wt:new"]
description = "Create .worktrees/<type>-<slug> on branch <type>/<slug>, with .worktreeinclude files copied in"
usage = 'arg "<branch>" help="Branch name, <type>/<slug>"'
run = '''
main="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"
dir="$main/.worktrees/${usage_branch//\//-}"
git -C "$main" worktree add "$dir" -b "$usage_branch" main
grep -v -e '^#' -e '^$' "$main/.worktreeinclude" | while read -r f; do
    if [[ -e "$main/$f" ]]; then (cd "$main" && cp -a --parents "$f" "$dir/"); fi
done
mise trust -q "$dir/.mise/config.toml"
echo "$dir"
'''

[tasks."wt:rm"]
description = "Remove a worktree and its branch; refuses if it has uncommitted work or unmerged commits"
usage = 'arg "<branch>" help="Branch name, <type>/<slug>"'
run = '''
main="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"
git -C "$main" merge-base --is-ancestor "$usage_branch" main || mise run //:log fatal "Branch is not merged into main" branch "$usage_branch"
git -C "$main" worktree remove "$main/.worktrees/${usage_branch//\//-}"
git -C "$main" branch -d "$usage_branch"
'''

[tasks.land]
description = "Land a tested branch: rebase if needed, ff-merge and push, wait for the Flux artifact, resume, remove the worktree"
usage = '''
arg "<branch>" help="Branch name, <type>/<slug>"
arg "<target>" var=#true help="Tested Kustomization, <cluster>:<ns>/<ks>"
flag "--force" help="Land even if main moved under the tested Kustomizations"
'''
confirm = { message = "Land {{ usage.branch }} on main and push it? Run this only after the live deployment was confirmed.", default = "no" }
run = '''
main="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"
dir="$main/.worktrees/${usage_branch//\//-}"
eval "targets=(${usage_target:-})"
git_main() { git -C "$main" "$@"; }
kc() { local c="$1"; shift; KUBECONFIG="$main/kube/clusters/$c/kubeconfig" kubectl --context "$c" "$@"; }
clusters="$(printf '%s\n' "${targets[@]}" | cut -d: -f1 | sort -u)"

for t in "${targets[@]}"; do
    [[ "$t" =~ ^[a-z0-9-]+:[^/:]+/[^/:]+$ && -d "$main/kube/clusters/${t%%:*}" ]] \
        || mise run //:log fatal "Target must be <cluster>:<ns>/<ks>" target "$t"
done

# Checks before anything moves
git_main rev-parse --verify -q "refs/heads/$usage_branch" >/dev/null || mise run //:log fatal "No such branch" branch "$usage_branch"
[[ -d "$dir" ]] || mise run //:log fatal "No worktree for the branch" dir "$dir"
[[ -n "$(git_main log --oneline "main..$usage_branch")" ]] || mise run //:log fatal "Branch has no commits ahead of main" branch "$usage_branch"
[[ -z "$(git -C "$dir" status --porcelain)" ]] || mise run //:log fatal "Worktree is not clean" dir "$dir"
[[ "$(git_main branch --show-current)" == "main" ]] || mise run //:log fatal "Main checkout is not on main" dir "$main"
[[ -z "$(git_main status --porcelain)" ]] || mise run //:log fatal "Main checkout is not clean" dir "$main"

git_main fetch origin
base="$(git_main merge-base "$usage_branch" origin/main)"
if [[ "$base" != "$(git_main rev-parse origin/main)" ]]; then
    changed="$(git_main diff --name-only "$base" origin/main)"
    patterns=(kube/base/ kube/components/)
    for t in "${targets[@]}"; do
        c="${t%%:*}"; nsks="${t#*:}"
        kpath="$(find "$dir/kube/clusters/$c/apps/${nsks%/*}" "$dir/kube/base/${nsks%/*}" -name ks.yaml 2>/dev/null \
            | xargs -r yq -r "select(.kind == \"Kustomization\" and .metadata.name == \"${nsks#*/}\") | .spec.path" \
            | grep -v -e '^$' -e '^null$' | head -1 || true)"
        [[ -n "$kpath" ]] || mise run //:log fatal "Cannot find the path of the Kustomization" target "$t"
        patterns+=("${kpath#./}/")
    done
    overlap="$(printf '%s\n' "$changed" | while read -r f; do for p in "${patterns[@]}"; do [[ "$f" == "$p"* ]] && echo "$f"; done; done || true)"
    if [[ -n "$overlap" && "${usage_force:-}" != "true" ]]; then
        printf '%s\n' "$overlap"
        mise run //:log fatal "main moved under your test, re-test (or use --force)" branch "$usage_branch"
    fi
    mise run //:log info "Rebasing onto origin/main" branch "$usage_branch"
    git -C "$dir" rebase origin/main || { git -C "$dir" rebase --abort; mise run //:log fatal "Rebase failed, resolve it by hand" branch "$usage_branch"; }
fi

git_main pull --ff-only
git_main merge --ff-only "$usage_branch"
git_main push origin main
sha="$(git_main rev-parse HEAD)"
mise run //:log info "Pushed" sha "$sha"

resume_hint() { for c in $clusters; do echo "  mise run //kube/clusters/$c:resume-ks flux-system flux-system, then each target"; done; }
for c in $clusters; do
    mise run //:log info "Waiting for the artifact" cluster "$c" sha "$sha"
    for i in $(seq 0 59); do
        rev="$(kc "$c" get ocirepository -n flux-system flux-system -o jsonpath='{.status.artifact.metadata.org\.opencontainers\.image\.revision}' 2>/dev/null || true)"
        [[ "$rev" == *"$sha"* ]] && break
        ready="$(kc "$c" get ocirepository -n flux-system flux-system -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)"
        if [[ "$ready" == "False" ]]; then
            resume_hint
            mise run //:log fatal "OCIRepository went Ready=False, left suspended" cluster "$c"
        fi
        ci="$(fjo run list --commit "$sha" --workflow oci-push.yaml -R Exikle/home-infra --json status -q '.[0].status' 2>/dev/null || true)"
        if [[ "$ci" == "failure" || "$ci" == "cancelled" ]]; then
            resume_hint
            mise run //:log fatal "Push OCI Artifact run did not succeed, left suspended" status "$ci" sha "$sha"
        fi
        (( i % 6 == 0 )) && mise run "//kube/clusters/$c:sync-flux" ocirepo flux-system
        sleep 15
    done
    if [[ "$rev" != *"$sha"* ]]; then
        resume_hint
        mise run //:log fatal "Timed out after 15 minutes, left suspended" cluster "$c" sha "$sha"
    fi
    mise run //:log info "Artifact carries the commit" cluster "$c"
done

for c in $clusters; do
    mise run "//kube/clusters/$c:resume-ks" flux-system flux-system
    for t in "${targets[@]}"; do
        [[ "${t%%:*}" == "$c" ]] || continue
        nsks="${t#*:}"
        src="$(kc "$c" get kustomization -n "${nsks%/*}" "${nsks#*/}" -o jsonpath='{.spec.sourceRef.kind}/{.spec.sourceRef.namespace}/{.spec.sourceRef.name}' 2>/dev/null || true)"
        if [[ "$src" == ExternalArtifact/* ]]; then
            ean="${src#ExternalArtifact/}"; ens="${ean%%/*}"; ean="${ean#*/}"; ens="${ens:-${nsks%/*}}"
            for i in $(seq 0 35); do
                rev="$(kc "$c" get externalartifact -n "$ens" "$ean" -o jsonpath='{.status.artifact.metadata.org\.opencontainers\.image\.revision}' 2>/dev/null || true)"
                [[ "$rev" == *"$sha"* ]] && break
                sleep 5
            done
            if [[ "$rev" == *"$sha"* ]]; then
                mise run //:log info "ExternalArtifact carries the commit" cluster "$c" artifact "$ens/$ean"
            else
                mise run //:log warn "ExternalArtifact does not carry the commit after 3 minutes, resuming anyway" cluster "$c" artifact "$ens/$ean" revision "$rev"
            fi
        fi
        mise run "//kube/clusters/$c:resume-ks" "${nsks%/*}" "${nsks#*/}"
    done
done

cd "$main"
mise run //:wt:rm "$usage_branch"
if git_main ls-remote --exit-code --heads origin "$usage_branch" >/dev/null 2>&1; then
    git_main push origin --delete "$usage_branch"
fi
mise run //:log info "Landed" branch "$usage_branch" sha "$sha"
'''

[tasks."wt:ls"]
description = "List worktrees"
run = "git worktree list"

[tools]
talos = "1.14.4"
"github:home-operations/kopiur" = "0.11.2"
opentofu = "1.13.10"
"pypi:ansible-core" = "2.22.0"
"pipx:ansible-lint" = "26.11.0"
