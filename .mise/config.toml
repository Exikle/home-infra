[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"

[settings]
# No mise.lock here. Every tool below is an exact pin that Renovate bumps, and mise still
# verifies signatures at install. The global config says the same; this holds it for
# CI and machines without it.
lockfile = false

[tools]
# Frostlink runs Talos v1.14, and talosctl decodes config documents client-side:
# a v1.13 client rejects KubeTalosAPIAccessConfig with "not registered" before the node
# ever sees it. Pinned here rather than globally so Artemis keeps the stable client.
talos = "1.14.2"
"github:home-operations/flate" = "0.6.5"
"github:home-operations/yayamlls" = "0.3.2"
"github:mitsuhiko/minijinja" = "3.0.0"
oxfmt = "0.72.0"
shellcheck = "0.11.0"
zizmor = "1.30.1"
hk = "2.6.0"
