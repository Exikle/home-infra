min_version = "2026.11.8"

monorepo_root = true

include = [
  "git::https://git.dcunha.io/exikle/mise-config.git//base.toml?ref=bb896c3981044ef677942ed7fefa44772b4b3282",
  "git::https://git.dcunha.io/exikle/mise-config.git//cluster.toml?ref=bb896c3981044ef677942ed7fefa44772b4b3282",
]

[monorepo]
config_roots = [
  "ai",
  "ansible",
  "kube/clusters/*",
  "kube/clusters/*/bootstrap",
  "kube/clusters/*/talos",
  "terraform",
]

[env]
_.file = { path = "{{config_root}}/.env", redact = true }
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"
ANSIBLE_CONFIG = "{{config_root}}/ansible/ansible.cfg"
ANSIBLE_INVENTORY = "{{config_root}}/ansible/inventory/hosts.yml"
ANSIBLE_ROLES_PATH = "{{config_root}}/ansible/roles"
ANSIBLE_COLLECTIONS_PATH = "{{config_root}}/ansible/collections"
FORGEJO_HOST = "git.dcunha.io"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"

[settings]
lockfile = false
task.quiet = true

[task_config]
cascade = true
shell = "bash -euo pipefail -c"

[tasks.log]
hide = true
run = "gum log -t rfc3339 -s -l"

[tasks.template]
hide = true
dir = "{{ cwd }}"
usage = '''
arg "<file>" help="Template path, or - for stdin"
arg "[args]" var=#true help="Extra arguments for minijinja-cli"
'''
run = '''
eval "args=(${usage_args:-})"
minijinja-cli "$usage_file" "${args[@]}" | op inject
'''

[tasks."wt:new"]
description = "Create .worktrees/<type>-<slug> on branch <type>/<slug>, with .worktreeinclude files copied in"
usage = 'arg "<branch>" help="Branch name, <type>/<slug>"'
run = '''
main="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"
dir="$main/.worktrees/${usage_branch//\//-}"
git -C "$main" worktree add "$dir" -b "$usage_branch" main
grep -v -e '^#' -e '^$' "$main/.worktreeinclude" | while read -r f; do
    if [[ -e "$main/$f" ]]; then (cd "$main" && cp -a --parents "$f" "$dir/"); fi
done
mise trust -q "$dir/.mise/config.toml"
echo "$dir"
'''

[tasks."wt:rm"]
description = "Remove a worktree and its branch; refuses if it has uncommitted work or unmerged commits"
usage = 'arg "<branch>" help="Branch name, <type>/<slug>"'
run = '''
main="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"
git -C "$main" merge-base --is-ancestor "$usage_branch" main || mise run //:log fatal "Branch is not merged into main" branch "$usage_branch"
git -C "$main" worktree remove "$main/.worktrees/${usage_branch//\//-}"
git -C "$main" branch -d "$usage_branch"
'''

[tasks."wt:ls"]
description = "List worktrees"
run = "git worktree list"

[tools]
talos = "1.14.4"
"github:home-operations/kopiur" = "0.10.21"
opentofu = "1.13.9"
"pypi:ansible-core" = "2.22.0"
"pipx:ansible-lint" = "26.11.0"
