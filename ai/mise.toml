[tasks.env]
description = "Regenerate .env with MCP bearer tokens and the Forgejo PAT from 1Password (gitignored)"
run = '''
cd "$MISE_MONOREPO_ROOT"
umask 077
{
    echo "# Generated by \`mise run //ai:env\` — gitignored, do not commit."
    echo "AGENTGATEWAY_API_KEY=$(op read 'op://artemis/agentgateway/KEY_OPENCODE_CLI')"
    echo "MCP_GENERAL_KEY=$(op read 'op://artemis/agentgateway/KEY_GENERAL')"
    echo "MCP_OPS_KEY=$(op read 'op://artemis/agentgateway/KEY_OPS')"
    echo "MEMINI_API_KEY=$(op read 'op://artemis/memini/MEMINI_API_KEY')"
    echo "FORGEJO_TOKEN=$(op read 'op://infrastructure/forgejo/EXIKLE_CLI_TOKEN')"
} > .env
echo "wrote .env ($(wc -l < .env) lines, mode $(stat -c %a .env))"
'''

[tasks.lint-agents]
description = "Audit this repo's own agent config — symlinks, frontmatter, @imports, the reference index"
run = 'python3 "$MISE_MONOREPO_ROOT/scripts/check-agent-config.py"'

[tasks.eval]
description = "Behavioural tests for the agent instructions — costs tokens, so it is on demand, never in a hook"
usage = 'arg "[args]" var=#true help="Arguments for eval-instructions.py"'
run = '''
eval "args=(${usage_args:-})"
python3 "$MISE_MONOREPO_ROOT/scripts/eval-instructions.py" "${args[@]}"
'''
