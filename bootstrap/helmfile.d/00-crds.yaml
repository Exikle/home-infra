---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

helmDefaults:
  args:
    - --include-crds
    - --no-hooks

releases:
  - name: cloudflare-dns
    namespace: network
    chart: oci://ghcr.io/home-operations/charts-mirror/external-dns
    version: 1.21.1

  - name: envoy-gateway
    namespace: network
    # Pulled via mirror.gcr.io (not docker.io, unlike the live app's OCIRepository) to
    # avoid Docker Hub anonymous pull-rate-limits during bootstrap, before any registry
    # mirror/cache exists on the cluster. Keep the version in sync with
    # kubernetes/apps/network/envoy-gateway/app/ocirepository.yaml.
    chart: oci://mirror.gcr.io/envoyproxy/gateway-helm
    version: 1.8.3
