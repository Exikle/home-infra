---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Render Clusters

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - kube/**
  workflow_dispatch:

# permissions: unsupported in Forgejo — grant via repo Settings → Actions → Authorized Integrations
# permissions:
#   contents: read

jobs:
  changes:
    name: Which clusters changed
    runs-on: ubuntu-latest
    container: git.dcunha.io/exikle/ci-toolbox:0.2.0
    timeout-minutes: 5
    outputs:
      clusters: ${{ steps.diff.outputs.clusters }}
    steps:
      # Same rule as oci-push.yaml: kube/base and kube/components reach both clusters, a cluster's
      # apps and components reach only that cluster. A manual run renders both.
      - name: Diff the change
        id: diff
        shell: bash
        env:
          API_URL: ${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}
          CLONE_URL: ${{ forgejo.server_url }}/${{ forgejo.repository }}.git
          GIT_TOKEN: ${{ forgejo.token }}
          EVENT: ${{ forgejo.event_name }}
          PUSH_BEFORE: ${{ forgejo.event.before }}
          PUSH_SHA: ${{ forgejo.sha }}
          PR_NUMBER: ${{ forgejo.event.pull_request.number }}
        run: |-
          set -euo pipefail
          both() { echo 'clusters=["artemis","frostlink"]' >> "$FORGEJO_OUTPUT"; exit 0; }
          case "$EVENT" in
            # The PR's own file list. pull_request.base.sha is main when the PR opened, not the
            # merge base, so a sha diff would include everything merged since.
            pull_request)
              files=""; page=1
              while :; do
                batch=$(curl -sf -H "Authorization: token ${GIT_TOKEN}" "${API_URL}/pulls/${PR_NUMBER}/files?limit=50&page=${page}" | jq -r '(. // [])[].filename') || both
                [ -n "$batch" ] || break
                files+="${batch}"$'\n'; page=$((page + 1))
              done
              ;;
            push)
              { [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; } || both
              git init -q src && cd src
              git -c "http.extraHeader=Authorization: token ${GIT_TOKEN}" \
                fetch -q --depth 1 "$CLONE_URL" "$PUSH_SHA" "$PUSH_BEFORE"
              files=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_SHA")
              ;;
            *) both ;;
          esac
          printf 'changed:\n%s\n' "$files"
          list=()
          for c in artemis frostlink; do
            if grep -E "^kube/(base/|components/|clusters/${c}/(apps|components)/)" <<<"$files" >/dev/null; then list+=("\"$c\""); fi
          done
          # An empty matrix makes Forgejo skip creating the render job, and Result then blocks
          # forever. "none" keeps one render job whose steps all skip.
          [ ${#list[@]} -gt 0 ] || list=('"none"')
          echo "clusters=[$(IFS=,; echo "${list[*]}")]" >> "$FORGEJO_OUTPUT"

  render:
    name: Render ${{ matrix.cluster }}
    needs: changes
    # The runner's default image: Debian-based and ships node, so checkout and the cached
    # mise install work as actions.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cluster: ${{ fromJSON(needs.changes.outputs.clusters) }}
    steps:
      - name: Checkout
        if: matrix.cluster != 'none'
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # flate comes from the shared mise-config pin, the same version as local render-ks.
      - name: Install Tools
        if: matrix.cluster != 'none'
        uses: https://github.com/jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: github:home-operations/flate
          cache: true

      # Renders every Kustomization and HelmRelease the cluster's Flux would see, from the repo
      # root (spec.path values are repo-root-relative). Secrets that exist only live are skipped.
      - name: Render
        if: matrix.cluster != 'none'
        env:
          CLUSTER: ${{ matrix.cluster }}
          FLATE_ALLOW_MISSING_KINDS: Secret
          FLATE_DISABLE_CHART_DIGEST_TRACKING: "true"
        run: flate build all --no-progress --path "kube/clusters/${CLUSTER}" > /dev/null

  # The one check branch protection requires. It always reports: it passes when no cluster
  # needed a render, and fails when the diff or any render failed.
  result:
    name: Result
    needs: [changes, render]
    if: always()
    runs-on: ubuntu-latest
    container: git.dcunha.io/exikle/ci-toolbox:0.2.0
    timeout-minutes: 5
    steps:
      - name: Check the render jobs
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          RENDER: ${{ needs.render.result }}
        run: |-
          echo "changes=${CHANGES} render=${RENDER}"
          [ "$CHANGES" = success ] || exit 1
          case "$RENDER" in success|skipped) ;; *) exit 1 ;; esac
