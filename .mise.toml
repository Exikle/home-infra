[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"

[tools]
# Frostlink runs Talos v1.14.0-rc.2, and talosctl decodes config documents client-side:
# a v1.13 client rejects KubeTalosAPIAccessConfig with "not registered" before the node
# ever sees it. Pinned here rather than globally so Artemis keeps the stable client.
talos = "1.14.2"
"github:home-operations/flate" = "0.6.5"
"github:home-operations/yayamlls" = "0.3.2"
"github:mitsuhiko/minijinja" = "2.24.0"
oxfmt = "0.68.0"
shellcheck = "0.11.0"
zizmor = "1.30.1"
