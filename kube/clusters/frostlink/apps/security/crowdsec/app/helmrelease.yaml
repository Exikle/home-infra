---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec
  interval: 1h
  values:
    container_runtime: containerd
    image:
      repository: docker.io/crowdsecurity/crowdsec
      tag: v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4
    config:
      config.yaml.local: |
        api:
          server:
            auto_registration:
              enabled: true
              token: "${REGISTRATION_TOKEN}"
              allowed_ranges:
                - "127.0.0.1/32"
                - "10.0.0.0/8"
        db_config:
          use_wal: true
          flush:
            max_age: 7d
            agents_autodelete:
              login_password: 1d
    lapi:
      deployAnnotations:
        reloader.stakater.com/auto: "true"
      envFrom:
        - secretRef:
            name: crowdsec
      persistentVolume:
        config:
          storageClassName: openebs-zfs
        data:
          storageClassName: openebs-zfs
      metrics:
        serviceMonitor:
          enabled: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
    agent:
      enabled: false
    appsec:
      enabled: true
      acquisitions:
        - source: appsec
          listen_addr: 0.0.0.0:7422
          path: /
          appsec_configs:
            - frostlink/appsec-bot-challenge
            - crowdsecurity/appsec-bot-challenge-exclude-ai-crawlers
            - crowdsecurity/appsec-bot-challenge-exclude-api
            - crowdsecurity/appsec-bot-challenge-exclude-crawler-files
            - crowdsecurity/appsec-bot-challenge-exclude-feeds
            - crowdsecurity/appsec-bot-challenge-exclude-google-ads
            - crowdsecurity/appsec-bot-challenge-exclude-monitoring
            - crowdsecurity/appsec-bot-challenge-exclude-search-engines
            - crowdsecurity/appsec-bot-challenge-exclude-social
            - crowdsecurity/appsec-bot-challenge-exclude-static
            - crowdsecurity/appsec-bot-challenge-exclude-webhooks
            - crowdsecurity/appsec-bot-challenge-exclude-wikimedia-citation
            - crowdsecurity/appsec-bot-challenge-scoring
            - crowdsecurity/appsec-bot-challenge-scoring-balanced
          labels:
            type: appsec
      rules:
        frostlink-forgejo-anon-label-scrape.yaml: |
          name: frostlink/forgejo-anon-label-scrape
          description: "Block Forgejo issue and pull list requests that filter on two or more labels"
          rules:
            - and:
                - zones:
                    - URI
                  transform:
                    - lowercase
                  match:
                    type: regex
                    value: "/(issues|pulls|milestone)"
                - zones:
                    - ARGS
                  variables:
                    - labels
                  match:
                    type: contains
                    value: ","
          labels:
            type: scraper
            service: http
            behavior: "http:scan"
            label: "Forgejo anonymous label-filter scrape"
      configs:
        frostlink-bot-challenge.yaml: |
          name: frostlink/appsec-bot-challenge
          inband_rules:
            - frostlink/forgejo-anon-label-scrape
          inband:
            pre_eval:
              - filter: req.Host in ["atuin.frostlink.dev", "flux-webhook.frostlink.dev", "hub.frostlink.dev","kromgo.frostlink.dev", "matrix.frostlink.dev", "matrix.frostlink.dev:443", "jellyfin.dcunha.io", "kromgo.dcunha.io", "silo-jf.dcunha.io", "xbs.dcunha.io"]
                apply:
                  - ExemptFromChallenge("machine-host")
              - filter: req.Host in ["frostlink.dev", "dcunha.io"] && req.URL.Path startsWith "/.well-known/"
                apply:
                  - ExemptFromChallenge("apex-well-known")
              - filter: req.Host in ["registry.frostlink.dev", "registry.dcunha.io"] && (req.URL.Path startsWith "/v2/" || req.URL.Path == "/v2" || req.URL.Path startsWith "/ap/" || req.URL.Path startsWith "/.well-known/" || req.URL.Path startsWith "/nodeinfo")
                apply:
                  - ExemptFromChallenge("apoci-machine-protocol")
              - filter: req.Host == "git.dcunha.io" && (req.URL.Path endsWith "/info/refs" || req.URL.Path endsWith "/git-upload-pack" || req.URL.Path endsWith "/git-receive-pack" || req.URL.Path contains "/info/lfs/" || req.URL.Path startsWith "/v2/" || req.URL.Path == "/v2" || req.URL.Path startsWith "/api/" || req.URL.Path startsWith "/twirp/" || req.URL.Path contains "/archive/" || req.URL.Path startsWith "/.well-known/")
                apply:
                  - ExemptFromChallenge("forgejo-machine-protocol")
              - filter: req.Host == "id.dcunha.io"
                apply:
                  - ExemptFromChallenge("oidc-provider")
              - filter: req.Host == "books.dcunha.io" && (req.URL.Path startsWith "/opds" || req.URL.Path startsWith "/koreader" || req.URL.Path startsWith "/api/" || (req.URL.Path == "/login" && req.Method == "POST"))
                apply:
                  - ExemptFromChallenge("ereader-sync")
              - filter: req.Host in ["audiobooks.dcunha.io", "auth.dcunha.io", "fitness.dcunha.io", "hass.dcunha.io", "hermes.dcunha.io", "home-assistant.dcunha.io", "komga.dcunha.io", "paperless.dcunha.io", "photos.dcunha.io", "renovate.dcunha.io", "requests.dcunha.io", "seerr.dcunha.io"] && (req.URL.Path startsWith "/api/" || req.URL.Path startsWith "/opds/" || req.URL.Path startsWith "/socket.io/" || req.URL.Path == "/auth/token")
                apply:
                  - ExemptFromChallenge("app-api")
              - filter: req.Host in ["gatus-sidecar.frostlink.dev", "status.dcunha.io", "status.frostlink.dev"] && (req.URL.Path startsWith "/api/" || req.URL.Path == "/metrics")
                apply:
                  - ExemptFromChallenge("status-api")
              - filter: req.UserAgent() startsWith "Gatus/"
                apply:
                  - ExemptFromChallenge("gatus")
              - filter: req.Header.Get("Accept") contains "activity+json" || req.Header.Get("Accept") contains "ld+json" || req.Header.Get("Content-Type") contains "activity+json" || req.Header.Get("Content-Type") contains "ld+json"
                apply:
                  - ExemptFromChallenge("activitypub")
              - filter: req.Header.Get("Signature") contains "keyId="
                apply:
                  - ExemptFromChallenge("signed-request")
              - filter: req.Host == "social.frostlink.dev" && (req.URL.Path startsWith "/api/" || req.URL.Path startsWith "/oauth/" || req.URL.Path startsWith "/auth/" || req.URL.Path startsWith "/check_your_input" || req.URL.Path startsWith "/fileserver/" || req.URL.Path startsWith "/nodeinfo/" || req.URL.Path startsWith "/users/" || req.URL.Path startsWith "/emoji/" || req.URL.Path startsWith "/assets/" || req.URL.Path startsWith "/settings" || req.URL.Path startsWith "/signup" || req.URL.Path startsWith "/authorize_interaction" || req.URL.Path startsWith "/.well-known/" || req.URL.Path in ["/inbox", "/custom_css"])
                apply:
                  - ExemptFromChallenge("gotosocial-service-routes")
      env:
        - name: COLLECTIONS
          value: crowdsecurity/appsec-bot-challenge
      metrics:
        serviceMonitor:
          enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        seccompProfile:
          type: RuntimeDefault
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: crowdsec-appsec
            patch: |-
              - op: replace
                path: /spec/template/spec/initContainers/0/resources/limits/memory
                value: 256Mi
