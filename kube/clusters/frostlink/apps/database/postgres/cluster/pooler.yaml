---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/pooler_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pooler-rw
spec:
  cluster:
    name: postgres
  instances: 1
  type: rw
  pgbouncer:
    authQuery: "SELECT $1, NULL"
    clientCASecret:
      name: pooler-client-cert
    clientTLSSecret:
      name: pooler-server-cert
    parameters:
      auth_type: cert
      client_tls_sslmode: verify-full
      default_pool_size: "60"
      max_client_conn: "1000"
      max_prepared_statements: "200"
      server_login_retry: "0"
      server_tls_sslmode: verify-full
    poolMode: session
    serverCASecret:
      name: pooler-server-cert
    serverTLSSecret:
      name: pooler-client-cert
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_podmonitors.yaml
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: &name pooler-rw
spec:
  podMetricsEndpoints:
    - port: metrics
  selector:
    matchLabels:
      cnpg.io/poolerName: *name
