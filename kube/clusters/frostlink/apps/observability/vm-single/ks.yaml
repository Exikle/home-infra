---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vm-single
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kube/clusters/frostlink/apps/observability/vm-single/app
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  components:
    - ../../../../components/kopiur
  postBuild:
    substitute:
      KOPIUR_APP: server-volume-victoria-metrics-server-0
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_SCHEDULE: H 3 * * *
      KOPIUR_KEEP_LATEST: "1"
      KOPIUR_KEEP_HOURLY: "0"
      KOPIUR_KEEP_DAILY: "7"
      KOPIUR_KEEP_WEEKLY: "0"
      KOPIUR_KEEP_MONTHLY: "0"
  wait: false
