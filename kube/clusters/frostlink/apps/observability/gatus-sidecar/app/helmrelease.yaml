---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus-sidecar
spec:
  chartRef:
    kind: OCIRepository
    name: gatus-sidecar
  interval: 1h
  upgrade:
    force: true
  values:
    config:
      existingConfigMap: "{{ .Release.Name }}-configmap"
      items:
        - key: cluster-endpoints.yaml
          path: cluster-endpoints.yaml
        - key: config.yaml
          path: config.yaml
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    gatus:
      delayStartSeconds: "20"
      envFrom:
        - secretRef:
            name: gatus
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/enabled: "false"
      additionalRules:
        - backendRefs:
            - name: gatus-home-push
              port: 8081
          matches:
            - path:
                type: Exact
                value: /api/v1/home-push
      hostnames:
        - "{{ .Release.Name }}.frostlink.dev"
        - status.dcunha.io
        - status.frostlink.dev
      parentRefs:
        - name: external-gateway
          namespace: network
          sectionName: https
    initContainers:
      - name: home-push
        image: docker.io/library/python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
        command:
          - python3
          - /scripts/receiver.py
        env:
          - name: HOME_PUSH_TOKEN
            valueFrom:
              secretKeyRef:
                name: gatus
                key: HOME_PUSH_TOKEN
        ports:
          - containerPort: 8081
            name: home-push
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
          - mountPath: /config
            name: config
          - mountPath: /scripts
            name: receiver-script
            readOnly: true
    monitoring:
      serviceMonitor:
        enabled: true
    persistence:
      enabled: true
      storageClass: openebs-zfs
    sidecar:
      kinds:
        httproute:
          enable: true
    volumes:
      - name: receiver-script
        configMap:
          name: gatus-sidecar-configmap
          items:
            - key: receiver.py
              path: receiver.py
