---
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

metrics: true

skip-invalid-config-update: true

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

ui:
  buttons:
    - name: Artemis
      link: https://git.dcunha.io/Exikle/Artemis-Cluster
    - name: Frostlink
      link: https://git.dcunha.io/Exikle/home-infra
  custom-css: |
    html:root {
      --background: 43.8 86.7% 94.1%;
      --foreground: 192.2 80.8% 14.3%;
      --card: 43.8 86.7% 94.1%;
      --card-foreground: 192.2 80.8% 14.3%;
      --popover: 43.8 86.7% 94.1%;
      --popover-foreground: 192.2 80.8% 14.3%;
      --primary: 203.4 71.6% 37.3%;
      --primary-foreground: 0 0% 100%;
      --secondary: 45.6 42.4% 88.4%;
      --secondary-foreground: 195 14% 39.2%;
      --muted: 45.6 42.4% 88.4%;
      --muted-foreground: 195 14% 39.2%;
      --accent: 45.6 42.4% 88.4%;
      --accent-foreground: 192.2 80.8% 14.3%;
      --destructive: 1 71.2% 52.4%;
      --destructive-foreground: 0 0% 100%;
      --border: 52.9 19.5% 82.9%;
      --input: 86.7 7.1% 75.1%;
      --ring: 204.8 69.4% 48.6%;
    }
    html:root.dark {
      --background: 192.2 100% 10.6%;
      --foreground: 180 6.9% 60.4%;
      --card: 192.2 100% 10.6%;
      --card-foreground: 180 6.9% 60.4%;
      --popover: 192.2 80.8% 14.3%;
      --popover-foreground: 180 6.9% 60.4%;
      --primary: 204.1 59.1% 57.8%;
      --primary-foreground: 192.2 100% 10.6%;
      --secondary: 193.1 59.1% 18.2%;
      --secondary-foreground: 180 7.2% 62%;
      --muted: 193.1 59.1% 18.2%;
      --muted-foreground: 186.3 8.3% 55.1%;
      --accent: 192 44.6% 22%;
      --accent-foreground: 180 6.9% 60.4%;
      --destructive: 1 71.2% 52.4%;
      --destructive-foreground: 0 0% 100%;
      --border: 193.1 59.1% 18.2%;
      --input: 192 44.6% 22%;
      --ring: 204.8 69.4% 48.6%;
    }
    .bg-green-400, .bg-green-500, .bg-green-600, .bg-green-700 { background-color: #859900 !important; }
    .bg-red-400, .bg-red-500, .bg-red-600, .bg-red-700 { background-color: #dc322f !important; }
    .bg-yellow-400, .bg-yellow-500 { background-color: #b58900 !important; }
    .text-green-500, .text-green-600, .text-green-700 { color: #687800 !important; }
    .text-red-500, .text-red-600, .text-red-700 { color: #da2825 !important; }
    .text-yellow-500, .text-yellow-600, .text-yellow-700 { color: #8f6c00 !important; }
    .dark [class*="text-green-"] { color: #859900 !important; }
    .dark [class*="text-red-"] { color: #e56663 !important; }
    .dark [class*="text-yellow-"] { color: #b58900 !important; }
    ::selection { background-color: rgb(38 139 210 / 25%); }
    .dark ::selection { background-color: rgb(38 139 210 / 30%); }
  dashboard-heading: Service Status
  dashboard-subheading: Live health of every service on Artemis (home) and Frostlink (cloud)
  default-sort-by: group
  description: Live health checks for services on Artemis and Frostlink
  header: dcunha.io
  link: https://status.dcunha.io
  title: Status | dcunha.io

web:
  port: ${GATUS_WEB_PORT}
