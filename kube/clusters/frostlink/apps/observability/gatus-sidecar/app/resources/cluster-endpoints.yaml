---
alerting:
  pushover:
    application-token: ${PUSHOVER_TOKEN}
    default-alert:
      description: health-check failed
      failure-threshold: 3
      minimum-reminder-interval: 1h
      send-on-resolved: true
      success-threshold: 2
    priority: 1
    resolved-priority: 0
    title: Gatus | Frostlink
    user-key: ${PUSHOVER_USER_KEY}

endpoints:
  - name: ping
    group: core
    url: icmp://${DDNS_HOSTNAME}
    interval: 1m
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: pushover

  - name: status-page
    group: core
    url: https://status.dcunha.io
    interval: 1m
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: pushover

  - name: headscale
    group: core
    url: https://headscale.frostlink.dev/health
    interval: 1m
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: pushover

external-endpoints:
  - name: heartbeat
    group: core
    token: ${HEARTBEAT_TOKEN}
    heartbeat:
      interval: 5m
    alerts:
      - type: pushover

  - name: artemis
    group: core
    token: ${HEARTBEAT_ARTEMIS_TOKEN}
    heartbeat:
      interval: 5m
    alerts:
      - type: pushover

  - name: frostlink
    group: core
    token: ${HEARTBEAT_FROSTLINK_TOKEN}
    heartbeat:
      interval: 5m
    alerts:
      - type: pushover
