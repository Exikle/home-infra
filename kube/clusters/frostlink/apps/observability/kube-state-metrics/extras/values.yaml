resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

rbac:
  extraRules:
    - verbs: [list, watch]
      apiGroups:
        - source.toolkit.fluxcd.io
        - kustomize.toolkit.fluxcd.io
        - helm.toolkit.fluxcd.io
      resources:
        - ocirepositories
        - helmrepositories
        - helmcharts
        - kustomizations
        - helmreleases

customResourceState:
  enabled: true
  config:
    spec:
      resources:
        - groupVersionKind:
            group: kustomize.toolkit.fluxcd.io
            version: v1
            kind: Kustomization
          metricNamePrefix: gotk
          metrics:
            - name: resource_info
              help: The current state of a Flux Kustomization resource.
              each:
                type: Info
                info:
                  labelsFromPath:
                    name: [metadata, name]
              labelsFromPath:
                exported_namespace: [metadata, namespace]
                ready:
                  - status
                  - conditions
                  - "[type=Ready]"
                  - status
                suspended: [spec, suspend]
                revision: [status, lastAppliedRevision]
                source_name: [spec, sourceRef, name]
        - groupVersionKind:
            group: helm.toolkit.fluxcd.io
            version: v2
            kind: HelmRelease
          metricNamePrefix: gotk
          metrics:
            - name: resource_info
              help: The current state of a Flux HelmRelease resource.
              each:
                type: Info
                info:
                  labelsFromPath:
                    name: [metadata, name]
              labelsFromPath:
                exported_namespace: [metadata, namespace]
                ready:
                  - status
                  - conditions
                  - "[type=Ready]"
                  - status
                suspended: [spec, suspend]
                revision:
                  - status
                  - history
                  - "0"
                  - chartVersion
                chart_name:
                  - status
                  - history
                  - "0"
                  - chartName
        - groupVersionKind:
            group: source.toolkit.fluxcd.io
            version: v1
            kind: OCIRepository
          metricNamePrefix: gotk
          metrics:
            - name: resource_info
              help: The current state of a Flux OCIRepository resource.
              each:
                type: Info
                info:
                  labelsFromPath:
                    name: [metadata, name]
              labelsFromPath:
                exported_namespace: [metadata, namespace]
                ready:
                  - status
                  - conditions
                  - "[type=Ready]"
                  - status
                suspended: [spec, suspend]
                revision: [status, artifact, revision]
                url: [spec, url]
