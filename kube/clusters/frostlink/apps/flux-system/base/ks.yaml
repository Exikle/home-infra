---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: base
  namespace: flux-system
  labels:
    home-infra/flux-defaults: from-component
spec:
  path: ./kube/base
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  timeout: 5m
  postBuild:
    substitute:
      CLUSTER: frostlink
  wait: false
  patches:
    - patch: |-
        - op: add
          path: /spec/dependsOn/-
          value:
            name: apoci
            namespace: fediverse
        - op: add
          path: /spec/dependsOn/-
          value:
            name: envoy-gateway
            namespace: network
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: flux-instance
    - patch: |-
        - op: add
          path: /spec/dependsOn
          value:
            - name: external-secrets
              namespace: external-secrets
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: flux-webhook
    - patch: |-
        - op: add
          path: /spec/dependsOn
          value:
            - name: cert-manager
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: postgres-ca
    - patch: |-
        - op: replace
          path: /spec/wait
          value: false
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: alertmanager
    - patch: |-
        - op: replace
          path: /spec/components
          value:
            - ../../../../components/kopiur
            - ../../../../components/postgres/csi
        - op: replace
          path: /spec/postBuild/substitute
          value:
            APP: apoci
            KOPIUR_APP: apoci-data
            KOPIUR_CAPACITY: 20Gi
            KOPIUR_SCHEDULE: H */6 * * *
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: apoci
