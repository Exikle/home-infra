---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app flux-instance
spec:
  targetNamespace: flux-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kube/clusters/frostlink/apps/flux-system/flux-instance/app
  prune: false
  sourceRef:
    kind: ExternalArtifact
    name: flux-instance
  interval: 1h
  dependsOn:
    - name: flux-operator
    - name: apoci
      namespace: fediverse
    - name: envoy-gateway
      namespace: network
  wait: true
