---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base
patches:
  - patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: apoci
          namespace: fediverse
      - op: add
        path: /spec/dependsOn/-
        value:
          name: envoy-gateway
          namespace: network
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: flux-instance
