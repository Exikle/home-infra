---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zfs-localpv
spec:
  chartRef:
    kind: OCIRepository
    name: zfs-localpv
  interval: 1h
  values:
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: true
        hostpath:
          enabled: false
      replicated:
        mayastor:
          enabled: false
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: true
    zfs-localpv:
      analytics:
        enabled: false
      crds:
        zfsLocalPv:
          enabled: true
      zfsNode:
        encrKeysDir: /var/openebs/keys
        kubeletDir: /var/lib/kubelet
    loki:
      enabled: false
    alloy:
      enabled: false
    preUpgradeHook:
      enabled: false
