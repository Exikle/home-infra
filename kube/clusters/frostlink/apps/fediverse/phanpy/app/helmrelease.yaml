---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: phanpy
spec:
  chartRef:
    kind: OCIRepository
    name: phanpy
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101

    controllers:
      phanpy:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jjgadgets/phanpy
              tag: 2026.10.09.febb38d@sha256:25c0a0298884e5c8484180ccf17dd2177b7f13cf9936818ae2a1d134e6ce00c4
            env:
              PHANPY_DEFAULT_INSTANCE: social.frostlink.dev
              PHANPY_WEBSITE: https://phanpy.frostlink.dev
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add: ["NET_BIND_SERVICE"]
                drop: ["ALL"]
              readOnlyRootFilesystem: true

    persistence:
      cache:
        type: emptyDir
        advancedMounts:
          phanpy:
            app:
              - path: /tmp
                subPath: tmp
              - path: /data
                subPath: data
              - path: /config
                subPath: config

    route:
      app:
        hostnames:
          - phanpy.frostlink.dev
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080

    service:
      app:
        ports:
          http:
            port: 8080
