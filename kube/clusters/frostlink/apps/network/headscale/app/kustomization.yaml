---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/kopiur
  - ../../../../components/kopiur-deep-verify
resources:
  - ./dnsendpoint.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: headscale-configmap
    files:
      - config.yaml=./resources/config.yaml
      - policy.hujson=./resources/policy.hujson
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
patches:
  - target:
      kind: Restore
    patch: |-
      - op: remove
        path: /spec/mover/inheritSecurityContextFrom
      - op: add
        path: /spec/mover/podSecurityContext
        value:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
