---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app continuwuity
spec:
  targetNamespace: matrix
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kube/clusters/frostlink/apps/matrix/continuwuity/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: continuwuity
  interval: 1h
  components:
    - ../../../../components/kopiur
  postBuild:
    substitute:
      APP: continuwuity
      KOPIUR_APP: continuwuity
      KOPIUR_CAPACITY: 10Gi
  wait: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: continuwuity
      namespace: matrix
