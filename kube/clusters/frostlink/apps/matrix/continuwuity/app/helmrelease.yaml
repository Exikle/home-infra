---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app continuwuity
spec:
  chartRef:
    kind: OCIRepository
    name: continuwuity
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      continuwuity:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: forgejo.ellis.link/continuwuation/continuwuity
              tag: v26.9.4@sha256:5f21a556290df5b6eda30c7d695288f5c4b06f9529a64e2cae040297287496c3
            env:
              CONDUWUIT_CONFIG: /etc/conduwuit/conduwuit.toml
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 150m
                memory: 512Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
    externalSecrets:
      app:
        dataFrom:
          - extract:
              key: continuwuity
        forceRename: continuwuity
        refreshInterval: 1m
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          creationPolicy: Owner
          name: continuwuity
          template:
            templateFrom:
              - configMap:
                  items:
                    - key: conduwuit.toml
                  name: continuwuity-configmap
    persistence:
      config:
        enabled: true
        existingClaim: continuwuity
        globalMounts:
          - path: /data
      conduwuit-toml:
        type: secret
        name: continuwuity
        globalMounts:
          - path: /etc/conduwuit/conduwuit.toml
            subPath: conduwuit.toml
            readOnly: true
      tmp:
        type: emptyDir
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: continuwuity
        hostnames:
          - matrix.frostlink.dev
        parentRefs:
          - name: external-gateway
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
      wellknown:
        hostnames:
          - frostlink.dev
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /.well-known/matrix/server
              - path:
                  type: Exact
                  value: /.well-known/matrix/client
            backendRefs:
              - identifier: app
                port: 8080
    service:
      app:
        controller: continuwuity
        ports:
          http:
            port: 8080
