---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seed-registry
  namespace: flux-system
  labels:
    app.kubernetes.io/name: seed-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seed-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed-registry
    spec:
      containers:
        - name: registry
          image: mirror.gcr.io/library/registry:3
          ports:
            - containerPort: 5000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seed-registry
  namespace: flux-system
spec:
  selector:
    app.kubernetes.io/name: seed-registry
  ports:
    - name: http
      port: 5000
      targetPort: http
