[tasks.phase1]
description = "Phase 1: render Talos config and apply it to the node via the OCI public IP (needs FROSTLINK_INIT_IP)"
confirm = { message = "Bootstrap Frostlink — Phase 1 (Talos config + apply)?", default = "no" }
run = [{ task = ":config" }, { task = ":apply" }]

[tasks.phase2]
description = "Phase 2: bootstrap Kubernetes over the public IP, install base apps, seed Flux from the Forgejo artifact (needs 6443/tcp open on the OCI security list to your home /32)"
confirm = { message = "Bootstrap Frostlink — Phase 2 (k8s + helmfile + seed)?", default = "no" }
run = [
  { task = ":k8s" },
  { task = ":kubeconfig" },
  { task = ":talosconfig" },
  { task = ":base" },
  { task = ":cni" },
  { task = ":seed" },
  { task = ":apps" },
]

[tasks.tailnet]
description = "Join the rebuilt node to the restored Headscale: mint a one-hour tag:frostlink key and apply talos/patches/tailscale.yaml.j2"
confirm = { message = "Join Frostlink to Headscale (mint key + patch Talos)?", default = "no" }
run = [{ task = ":tailnet-join" }]

[tasks.zpool]
description = "Create the openebs ZFS pool on an empty block volume; does nothing if the pool already imported (oci-rebuild.md § The ZFS pool on sdb)"
confirm = { message = "Create the openebs ZFS pool on Frostlink if it is missing?", default = "no" }
usage = 'arg "<disk>" help="Whole-disk path of the empty block volume, for example /dev/sdb"'
run = '''
kc() { kubectl --context "$KUBE_CONTEXT" "$@"; }
node="$(kc get nodes -o jsonpath='{.items[0].metadata.name}')"
trap 'kc delete pod -n openebs-system -l app.kubernetes.io/managed-by=kubectl-debug --field-selector "spec.nodeName=$node" --ignore-not-found --wait=false >/dev/null' EXIT
host_zpool() {
    kc debug "node/$node" -n openebs-system --image=mirror.gcr.io/alpine:latest --profile=sysadmin \
        --attach --quiet -- chroot /host /usr/local/sbin/zpool "$@" 2>/dev/null
}
if host_zpool list -H -o name openebs | grep -qx openebs; then
    mise run //:log info "Pool openebs is already imported. Nothing to do." stage "$MISE_TASK_NAME"
    host_zpool status -P openebs
    exit 0
fi
mise run //:log warn "Creating pool openebs" stage "$MISE_TASK_NAME" disk "$usage_disk"
out="$(host_zpool create openebs "$usage_disk")"
host_zpool list -H -o name openebs | grep -qx openebs \
    || mise run //:log fatal "zpool create did not make the pool" stage "$MISE_TASK_NAME" output "$out"
host_zpool status -P openebs
'''

[tasks.config]
hide = true
run = '''
init_ip="${FROSTLINK_INIT_IP:?set FROSTLINK_INIT_IP to the OCI public IP}"
mkdir -p /tmp/frostlink-bootstrap

mise run //:log info "Generating Talos config..." stage "$MISE_TASK_NAME"
printf 'machine:\n  certSANs:\n    - %s\ncluster:\n  apiServer:\n    certSANs:\n      - %s\n' \
    "$init_ip" "$init_ip" > /tmp/frostlink-bootstrap/certsans.yaml
talosctl gen config frostlink "https://$init_ip:6443" \
    --config-patch @"$MISE_CONFIG_ROOT/../talos/patches/controlplane.yaml" \
    --config-patch @/tmp/frostlink-bootstrap/certsans.yaml \
    --output /tmp/frostlink-bootstrap \
    --force

talosctl --talosconfig /tmp/frostlink-bootstrap/talosconfig config endpoint "$init_ip"
'''

[tasks.apply]
hide = true
run = '''
init_ip="${FROSTLINK_INIT_IP:?set FROSTLINK_INIT_IP to the OCI public IP}"
mise run //:log info "Applying Talos config via OCI IP ($init_ip)..." stage "$MISE_TASK_NAME"
talosctl apply-config \
    --insecure \
    --nodes "$init_ip" \
    --file /tmp/frostlink-bootstrap/controlplane.yaml
mise run //:log info "Node is rebooting. Next: open 6443/tcp on the OCI security list to your home /32, then run: mise run //kube/clusters/frostlink/bootstrap:phase2" stage "$MISE_TASK_NAME"
'''

[tasks.k8s]
hide = true
run = '''
node_ip="${FROSTLINK_NODE_IP:-${FROSTLINK_INIT_IP:?set FROSTLINK_INIT_IP or FROSTLINK_NODE_IP}}"
mise run //:log info "Bootstrapping Kubernetes via $node_ip..." stage "$MISE_TASK_NAME"
until op=$(talosctl -n "$node_ip" \
    --talosconfig /tmp/frostlink-bootstrap/talosconfig \
    bootstrap 2>&1 || true) && [[ "$op" == *"AlreadyExists"* ]]; do
    mise run //:log info "Kubernetes bootstrap in progress. Retrying in 5 seconds..." stage "$MISE_TASK_NAME"
    sleep 5
done
'''

[tasks.kubeconfig]
hide = true
run = '''
node_ip="${FROSTLINK_NODE_IP:-${FROSTLINK_INIT_IP:?set FROSTLINK_INIT_IP or FROSTLINK_NODE_IP}}"
mise run //:log info "Fetching kubeconfig..." stage "$MISE_TASK_NAME"
talosctl kubeconfig \
    --talosconfig /tmp/frostlink-bootstrap/talosconfig \
    --nodes "$node_ip" \
    --force \
    --force-context-name "$KUBE_CONTEXT" \
    "$(dirname "$KUBECONFIG")"
'''

[tasks.talosconfig]
hide = true
run = '''
mise run //:log info "Installing the rebuild talosconfig at $TALOSCONFIG (endpoint ${FROSTLINK_INIT_IP:-})..." stage "$MISE_TASK_NAME"
install -m 600 /tmp/frostlink-bootstrap/talosconfig "$TALOSCONFIG"
'''

[tasks.base]
hide = true
run = '''
mise run //:log info "Applying namespaces..." stage "$MISE_TASK_NAME"
find ../apps -mindepth 1 -maxdepth 1 -type d | while IFS= read -r dir; do
    if ! kustomize build "$dir" | yq ea -e 'select(.kind == "Namespace")' | \
        kubectl --context "$KUBE_CONTEXT" apply --server-side --field-manager bootstrap --force-conflicts -f -; then
        mise run //:log fatal "Failed to apply namespace" stage "$MISE_TASK_NAME" namespace "$(basename "$dir")"
    fi
done
mise run //:log info "Applying bootstrap secrets..." stage "$MISE_TASK_NAME"
if ! mise run //:template resources.yaml.j2 | \
    kubectl --context "$KUBE_CONTEXT" apply --server-side --field-manager bootstrap --force-conflicts -f -; then
    mise run //:log fatal "Failed to apply bootstrap secrets" stage "$MISE_TASK_NAME"
fi
mise run //:log info "Applying CRDs..." stage "$MISE_TASK_NAME"
if ! helmfile -f helmfile.d/00-crds.yaml template -q | \
    yq ea -e 'select(.kind == "CustomResourceDefinition")' | \
    kubectl --context "$KUBE_CONTEXT" apply --server-side --field-manager bootstrap --force-conflicts -f -; then
    mise run //:log fatal "Failed to apply CRDs" stage "$MISE_TASK_NAME"
fi
'''

[tasks.cni]
hide = true
run = '''
mise run //:log info "Installing Cilium, CoreDNS, and cert-manager directly via helm (avoids SSA field-manager conflicts with helm-controller)..." stage "$MISE_TASK_NAME"

for app in kube-system/cilium kube-system/coredns cert-manager/cert-manager; do
    ns="${app%%/*}"
    name="${app##*/}"
    dir="../apps/${app}"
    [[ -f "$dir/app/ocirepository.yaml" ]] || dir="../../../base/${app}"
    ocirepo="${dir}/app/ocirepository.yaml"
    helmrelease="${dir}/app/helmrelease.yaml"
    extras="../apps/${app}/app/values.yaml"

    chart="$(yq '.spec.url' "$ocirepo")"
    version="$(yq '.spec.ref.tag' "$ocirepo")"
    values="$(yq '.spec.values' "$helmrelease")"
    if [[ -f "$extras" ]]; then
        values="$(yq ea 'select(fi == 0) * (select(fi == 1) | .spec.values)' "$extras" "$helmrelease")"
    fi

    mise run //:log info "Installing ${name}..." stage "$MISE_TASK_NAME" version "$version"
    if ! printf '%s\n' "$values" | \
        helm upgrade --install "$name" "$chart" \
            --kube-context "$KUBE_CONTEXT" \
            --version "$version" \
            --namespace "$ns" \
            --create-namespace \
            --values -; then
        mise run //:log fatal "Failed to install $name" stage "$MISE_TASK_NAME"
    fi
done
'''

[tasks.seed]
hide = true
run = '''
seed_tag="exikle/frostlink:main"
kc() { kubectl --context "$KUBE_CONTEXT" "$@"; }
mise run //:log info "Starting the throwaway seed registry..." stage "$MISE_TASK_NAME"
kc apply --server-side --field-manager bootstrap -f seed-registry.yaml
kc -n flux-system rollout status deploy/seed-registry --timeout=180s
work="$(mktemp -d)"
trap 'kill "${pf:-0}" 2>/dev/null || true; rm -rf "$work"' EXIT
mise run //:log info "Pulling the CI artifact from Forgejo (git.dcunha.io) over the home network..." stage "$MISE_TASK_NAME"
flux pull artifact "oci://git.dcunha.io/$seed_tag" --output "$work" \
    --creds "exikle:$(op read 'op://infrastructure/forgejo/EXIKLE_CLI_TOKEN')"
kc -n flux-system port-forward svc/seed-registry 5000:5000 >/dev/null 2>&1 &
pf=$!
for _ in $(seq 1 20); do curl -fs http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
mise run //:log info "Pushing it into the seed registry..." stage "$MISE_TASK_NAME"
flux push artifact "oci://127.0.0.1:5000/$seed_tag" --insecure-registry --path "$work" \
    --source "https://git.dcunha.io/Exikle/home-infra" \
    --revision "main@sha1:$(git -C "$MISE_CONFIG_ROOT" rev-parse HEAD)"
'''

[tasks.tailnet-join]
hide = true
run = '''
node_ip="${FROSTLINK_NODE_IP:-${FROSTLINK_INIT_IP:?set FROSTLINK_INIT_IP or FROSTLINK_NODE_IP}}"
kc() { kubectl --context "$KUBE_CONTEXT" "$@"; }
tmp="$(mktemp)"
trap 'shred -u "$tmp" 2>/dev/null || rm -f "$tmp"' EXIT
mise run //:log info "Minting a one-hour tag:frostlink pre-auth key on the restored Headscale..." stage "$MISE_TASK_NAME"
key="$(kc -n network exec deploy/headscale -c app -- \
    headscale preauthkeys create --tags tag:frostlink --expiration 1h -o json | jq -r '.key')"
[[ -n "$key" && "$key" != "null" ]] || mise run //:log fatal "Headscale returned no key" stage "$MISE_TASK_NAME"
chmod 600 "$tmp"
sed "s|op://infrastructure/headscale/TS_AUTH_KEY|${key}|" \
    ../talos/patches/tailscale.yaml.j2 > "$tmp"
mise run //:log info "Applying the tailscale ExtensionServiceConfig to $node_ip (no reboot)..." stage "$MISE_TASK_NAME"
talosctl --talosconfig "$TALOSCONFIG" -n "$node_ip" patch mc --patch @"$tmp"
mise run //:log info "Done. Delete the old frostlink node and check routes (oci-rebuild.md § Rebuild order, step 5):" stage "$MISE_TASK_NAME"
kc -n network exec deploy/headscale -c app -- headscale nodes list
'''

[tasks.apps]
hide = true
run = '''
mise run //:log info "Syncing apps via helmfile..." stage "$MISE_TASK_NAME"
if ! helmfile --kube-context "$KUBE_CONTEXT" -f helmfile.d/01-apps.yaml sync --hide-notes; then
    mise run //:log fatal "Failed to sync helmfile apps" stage "$MISE_TASK_NAME"
fi
'''
