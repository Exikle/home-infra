[tasks.upgrade]
description = "Upgrade Talos on the frostlink node to the current schematic and the given version (single node: a full cluster outage)"
usage = 'arg "<version>" help="Talos version, for example v1.14.4"'
confirm = { message = "Upgrade the only frostlink node to {{ usage.version }}? The whole cluster goes down.", default = "no" }
run = '''
schematic="$(mise run :schematic-id)"
endpoint="$(talosctl --context "$KUBE_CONTEXT" config info -o yaml | yq -e '.endpoints[0]')"
mise run //:log warn "Upgrading the only node" node "$endpoint" version "$usage_version" schematic "$schematic"
talosctl --context "$KUBE_CONTEXT" -n "$endpoint" upgrade \
    --image "factory.talos.dev/installer/$schematic:$usage_version" \
    --reboot-mode powercycle \
    --timeout 10m
'''

[tasks.diff-patch]
description = "Dry-run a delta patch against the frostlink node; the diff can hold the Tailscale key, never paste it"
usage = 'arg "<file>" help="Delta patch with only the changed fields, never patches/controlplane.yaml"'
run = '''
case "$(realpath "$usage_file")" in
"$MISE_CONFIG_ROOT"/patches/*)
    mise run //:log error "That is a gen-time patch, not a delta. Applying it strands the node." file "$usage_file"
    exit 2
    ;;
esac
endpoint="$(talosctl --context "$KUBE_CONTEXT" config info -o yaml | yq -e '.endpoints[0]')"
talosctl --context "$KUBE_CONTEXT" -n "$endpoint" patch machineconfig --patch-file "$usage_file" --dry-run
'''

[tasks.patch-node]
description = "Apply a delta patch to the frostlink node; run diff-patch first"
usage = '''
arg "<file>" help="Delta patch with only the changed fields, never patches/controlplane.yaml"
flag "--mode <mode>" default="auto" help="auto, no-reboot, staged or try. A reboot is a full outage"
'''
confirm = { message = "Patch the only frostlink node with {{ usage.file }}? If it reboots, the whole cluster goes down.", default = "no" }
run = '''
case "$(realpath "$usage_file")" in
"$MISE_CONFIG_ROOT"/patches/*)
    mise run //:log error "That is a gen-time patch, not a delta. Applying it strands the node." file "$usage_file"
    exit 2
    ;;
esac
endpoint="$(talosctl --context "$KUBE_CONTEXT" config info -o yaml | yq -e '.endpoints[0]')"
mise run //:log warn "Patching the only node" node "$endpoint" file "$usage_file" mode "$usage_mode"
talosctl --context "$KUBE_CONTEXT" -n "$endpoint" patch machineconfig --patch-file "$usage_file" --mode "$usage_mode"
'''

[tasks.schematic-id]
description = "Get the schematic ID from factory.talos.dev for the current schematic"
hide = true
run = '''
curl -fsSX POST --data-binary @"$MISE_CONFIG_ROOT/schematic.yaml" "https://factory.talos.dev/schematics" | jq -er '.id'
'''
