[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talosconfig"
KUBE_CONTEXT = "frostlink"
FLUX_ARTIFACT_IGNORE = "/*,!/kube/,/kube/*,!/kube/base/,!/kube/components/,!/kube/clusters/,/kube/clusters/*,!/kube/clusters/frostlink/,/kube/clusters/frostlink/talos/,/kube/clusters/frostlink/bootstrap/,/kube/clusters/frostlink/mise.toml,/kube/clusters/frostlink/kubeconfig,/kube/clusters/frostlink/talosconfig"

[tasks.apply-ks]
description = "Apply local Flux Kustomization — run suspend-ks first"
usage = '''
arg "<ns>" help="Namespace of the Flux Kustomization"
arg "<ks>" help="Name of the Flux Kustomization"
'''
run = '''
mise run //:log info "Applying" ns "$usage_ns" ks "$usage_ks"
mise run :render-ks "$usage_ns" "$usage_ks" \
    | kubectl --context "$KUBE_CONTEXT" apply --server-side --force-conflicts --field-manager=kustomize-controller -f -
mise run //:log info "Applied" ns "$usage_ns" ks "$usage_ks"
'''

[tasks.browse-pvc]
description = "Browse a PVC"
interactive = true
usage = '''
arg "<ns>" help="Namespace of the PVC"
arg "<claim>" help="Name of the PVC"
'''
run = '''
mise run //:log info "Browsing PVC, pod is removed on exit" ns "$usage_ns" pvc "$usage_claim"
kubectl --context "$KUBE_CONTEXT" run -n "$usage_ns" "browse-pvc-$usage_claim" -it --rm --restart=Never \
    --image=mirror.gcr.io/alpine:latest \
    --overrides='{"spec":{"containers":[{"name":"browse-pvc-{{ usage.claim }}","image":"mirror.gcr.io/alpine:latest","stdin":true,"tty":true,"command":["/bin/sh"],"workingDir":"/mnt","volumeMounts":[{"mountPath":"/mnt","name":"data"}]}],"volumes":[{"name":"data","persistentVolumeClaim":{"claimName":"{{ usage.claim }}"}}]}}'
'''

[tasks.debug-node]
description = "Debug a node"
interactive = true
usage = 'arg "<node>" help="Name of the node"'
run = '''
mise run //:log info "Debugging node with sysadmin profile, pod is removed on exit" node "$usage_node"
trap 'kubectl --context "$KUBE_CONTEXT" delete pod -n default -l app.kubernetes.io/managed-by=kubectl-debug --field-selector "spec.nodeName=$usage_node" --ignore-not-found --wait=false' EXIT
kubectl --context "$KUBE_CONTEXT" debug "node/$usage_node" -n default -it --image=mirror.gcr.io/alpine:latest --profile=sysadmin
'''

[tasks.delete-ks]
description = "Delete only the objects one Kustomization renders from local files, never the root — run suspend-ks first"
usage = '''
arg "<ns>" help="Namespace of the Flux Kustomization"
arg "<ks>" help="Name of the Flux Kustomization"
'''
run = '''
[[ "$usage_ns/$usage_ks" != "flux-system/flux-system" ]] \
    || mise run //:log fatal "Refusing the root, it owns every other Kustomization" ns "$usage_ns" ks "$usage_ks"
mise run //:log warn "Deleting" ns "$usage_ns" ks "$usage_ks"
mise run :render-ks "$usage_ns" "$usage_ks" \
    | yq "select(.metadata.labels.\"kustomize.toolkit.fluxcd.io/name\" == \"$usage_ks\" and .metadata.labels.\"kustomize.toolkit.fluxcd.io/namespace\" == \"$usage_ns\")" \
    | kubectl --context "$KUBE_CONTEXT" delete -f -
mise run //:log info "Deleted" ns "$usage_ns" ks "$usage_ks"
'''

[tasks.diff-ks]
description = "Diff a locally rendered Kustomization against the live cluster — exits 1 if they differ"
usage = '''
arg "<ns>" help="Namespace of the Flux Kustomization"
arg "<ks>" help="Name of the Flux Kustomization"
'''
run = '''
mise run //:log info "Diffing against live cluster" ns "$usage_ns" ks "$usage_ks"
rendered="$(mise run :render-ks "$usage_ns" "$usage_ks")"
if printf '%s\n' "$rendered" \
    | KUBECTL_EXTERNAL_DIFF="dyff between --omit-header --set-exit-code" \
      kubectl --context "$KUBE_CONTEXT" diff --server-side --force-conflicts -f -; then
    mise run //:log info "No differences" ns "$usage_ns" ks "$usage_ks"
else
    mise run //:log warn "Differences found" ns "$usage_ns" ks "$usage_ks"
    exit 1
fi
'''

[tasks.toggle-kopiur]
description = "Suspend or resume kopiur — the controller only; the webhook stays up"
usage = '''
arg "<state>" help="suspend or resume" {
  choices "suspend" "resume"
}
'''
run = '''
replicas=0
[[ "$usage_state" == "suspend" ]] || replicas=1
mise run //:log info "Toggling kopiur" state "$usage_state"
flux --context "$KUBE_CONTEXT" -n kopiur-system "$usage_state" kustomization kopiur
flux --context "$KUBE_CONTEXT" -n kopiur-system "$usage_state" helmrelease kopiur
kubectl --context "$KUBE_CONTEXT" -n kopiur-system scale deployment kopiur-controller --replicas "$replicas"
mise run //:log info "kopiur toggled" state "$usage_state"
'''

[tasks.prune-pods]
description = "Delete every pod that is not Running — Succeeded, Failed, Pending or Unknown"
run = '''
mise run //:log info "Pruning pods that are not Running"
kubectl --context "$KUBE_CONTEXT" delete pods -A --field-selector='status.phase!=Running' --ignore-not-found=true
'''

[tasks.resume-ks]
description = "Resume one Flux Kustomization — resume the root first if it is also suspended"
usage = '''
arg "<ns>" help="Namespace of the Flux Kustomization"
arg "<ks>" help="Name of the Flux Kustomization"
'''
run = '''
self="//${MISE_CONFIG_ROOT#"$MISE_MONOREPO_ROOT"/}"
mise run //:log info "Resuming" ns "$usage_ns" ks "$usage_ks"

if [[ "$usage_ns/$usage_ks" != "flux-system/flux-system" ]]; then
    root="$(kubectl --context "$KUBE_CONTEXT" -n flux-system get kustomization flux-system \
        -o jsonpath='{.spec.suspend}' 2>/dev/null || true)"
    [[ "$root" != "true" ]] || mise run //:log fatal \
        "Root still suspended, resume it first: mise run $self:resume-ks flux-system flux-system"
fi

if [[ "$usage_ns/$usage_ks" == "flux-system/flux-system" ]]; then
    kubectl --context "$KUBE_CONTEXT" -n flux-system annotate fluxinstance flux --overwrite \
        fluxcd.controlplane.io/reconcile=enabled "reconcile.fluxcd.io/requestedAt=$(date +%s)" >/dev/null
    mise run //:log info "Unpaused FluxInstance" name flux
fi

flux --context "$KUBE_CONTEXT" -n "$usage_ns" resume kustomization "$usage_ks" --timeout 10m \
    || mise run //:log fatal "Could not resume" ns "$usage_ns" ks "$usage_ks"
mise run //:log info "Resumed" ns "$usage_ns" ks "$usage_ks"

left="$(kubectl --context "$KUBE_CONTEXT" get kustomization -A \
    -o jsonpath='{range .items[?(@.spec.suspend==true)]}{.metadata.namespace}/{.metadata.name} {end}')"
[[ -z "$left" ]] || mise run //:log warn "Still suspended — resume these too" targets "$left"
'''

[tasks.suspend-ks]
description = "Suspend one Flux Kustomization — suspend the root separately, or it reverts your edits"
usage = '''
arg "<ns>" help="Namespace of the Flux Kustomization"
arg "<ks>" help="Name of the Flux Kustomization"
'''
run = '''
self="//${MISE_CONFIG_ROOT#"$MISE_MONOREPO_ROOT"/}"
mise run //:log info "Suspending" ns "$usage_ns" ks "$usage_ks"

if [[ "$usage_ns/$usage_ks" == "flux-system/flux-system" ]]; then
    kubectl --context "$KUBE_CONTEXT" -n flux-system annotate fluxinstance flux --overwrite \
        fluxcd.controlplane.io/reconcile=disabled >/dev/null
    mise run //:log info "Paused FluxInstance" name flux
fi

case "$(kubectl --context "$KUBE_CONTEXT" -n "$usage_ns" get kustomization "$usage_ks" -o jsonpath='{.spec.suspend}' 2>/dev/null || echo missing)" in
    true) mise run //:log info "Already suspended" ns "$usage_ns" ks "$usage_ks" ;;
    missing)
        [[ "$usage_ns/$usage_ks" != "flux-system/flux-system" ]] \
            || mise run //:log fatal "Root Kustomization not found — wrong context?" ns "$usage_ns" ks "$usage_ks"
        mise run //:log warn "Not in cluster yet, nothing to suspend" ns "$usage_ns" ks "$usage_ks" ;;
    *)
        flux --context "$KUBE_CONTEXT" -n "$usage_ns" suspend kustomization "$usage_ks" >/dev/null 2>&1 \
            || mise run //:log fatal "Could not suspend" ns "$usage_ns" ks "$usage_ks"
        mise run //:log info "Suspended" ns "$usage_ns" ks "$usage_ks" ;;
esac

if [[ "$usage_ns/$usage_ks" != "flux-system/flux-system" ]]; then
    root="$(kubectl --context "$KUBE_CONTEXT" -n flux-system get kustomization flux-system \
        -o jsonpath='{.spec.suspend}' 2>/dev/null || true)"
    [[ "$root" == "true" ]] || mise run //:log warn \
        "Root NOT suspended, it will revert your edits: mise run $self:suspend-ks flux-system flux-system"
fi
'''

[tasks.sync-flux]
description = "Sync a resource; optionally filter to a single name"
usage = '''
arg "<resource>" help="Kind of resource to sync" {
  choices "hr" "ks" "gitrepo" "ocirepo" "es"
}
arg "[name]" help="Only this name"
'''
run = '''
filter="${usage_name:-}"
kubectl --context "$KUBE_CONTEXT" get "$usage_resource" --no-headers -A | while read -r ns rname _; do
    [[ -n "$filter" && "$rname" != "$filter" ]] && continue
    kubectl --context "$KUBE_CONTEXT" -n "$ns" annotate --field-manager flux-client-side-apply --overwrite "$usage_resource" "$rname" \
        "force-sync=$(date +%s)" \
        "reconcile.fluxcd.io/requestedAt=$(date +%s)" \
        "reconcile.fluxcd.io/forceAt=$(date +%s)"
done
'''

[tasks.unstick-hr]
description = "Retry a stuck HelmRelease: force a one-off install or upgrade and reset its failure count"
usage = '''
arg "<ns>" help="Namespace of the HelmRelease"
arg "<hr>" help="Name of the HelmRelease"
'''
run = '''
flux --context "$KUBE_CONTEXT" -n "$usage_ns" reconcile helmrelease "$usage_hr" --force --reset
'''

[tasks.reset-hr]
description = "Last resort for a HelmRelease that unstick-hr cannot fix: delete its Helm release history and reinstall"
usage = '''
arg "<ns>" help="Namespace of the HelmRelease"
arg "<hr>" help="Name of the HelmRelease"
'''
confirm = { message = "Delete the Helm release history of {{ usage.ns }}/{{ usage.hr }}? Rollback to earlier revisions is lost.", default = "no" }
run = '''
kc() { kubectl --context "$KUBE_CONTEXT" "$@"; }
release="$(kc -n "$usage_ns" get helmrelease "$usage_hr" -o jsonpath='{.status.history[0].name}')"
storage="$(kc -n "$usage_ns" get helmrelease "$usage_hr" -o jsonpath='{.status.storageNamespace}')"
release="${release:-$usage_hr}"
storage="${storage:-$usage_ns}"
mise run //:log warn "Deleting Helm release history" release "$release" namespace "$storage"
flux --context "$KUBE_CONTEXT" -n "$usage_ns" suspend helmrelease "$usage_hr"
kc -n "$storage" delete secret -l "owner=helm,name=$release"
flux --context "$KUBE_CONTEXT" -n "$usage_ns" resume helmrelease "$usage_hr"
'''

[tasks.view-secret]
description = "View a secret with every value base64-decoded"
usage = '''
arg "<ns>" help="Namespace of the secret"
arg "<secret>" help="Name of the secret"
'''
run = '''
kubectl --context "$KUBE_CONTEXT" get secret -n "$usage_ns" "$usage_secret" -o yaml | yq '.data | map_values(@base64d)'
'''

[tasks.test-ks]
description = "Suspend the root and the named Kustomizations, then apply each from this worktree — then wait for the user and run land"
usage = '''
arg "<ns>" help="Namespace of the Flux Kustomizations"
arg "<ks>" var=#true help="Names of the Flux Kustomizations to test"
'''
run = '''
self="//${MISE_CONFIG_ROOT#"$MISE_MONOREPO_ROOT"/}"
[[ "$(git rev-parse --absolute-git-dir)" != "$(git rev-parse --path-format=absolute --git-common-dir)" ]] \
    || mise run //:log fatal "Run this from a worktree, apply-ks renders the tree of the working directory" next "mise run //:wt:new <type>/<slug>"
eval "targets=(${usage_ks:-})"

mise run "$self:suspend-ks" flux-system flux-system
for ks in "${targets[@]}"; do
    mise run "$self:suspend-ks" "$usage_ns" "$ks"
done
for ks in "${targets[@]}"; do
    mise run "$self:apply-ks" "$usage_ns" "$ks"
done

mise run //:log info "Suspended" root flux-system/flux-system targets "${targets[*]/#/$usage_ns/}"
mise run //:log info "Now wait for the user to confirm the live deployment, then run land"
'''

[tasks.render-ks]
hide = true
usage = '''
arg "<ns>"
arg "<ks>"
'''
run = '''
if [[ "$usage_ns/$usage_ks" == "flux-system/flux-system" ]]; then
    flux --context "$KUBE_CONTEXT" build kustomization flux-system -n flux-system --path "$MISE_CONFIG_ROOT/apps"
    exit 0
fi
tree="$(mktemp -d)"
trap 'rm -rf "$tree"' EXIT
flux build artifact --path "$MISE_MONOREPO_ROOT" --ignore-paths "$FLUX_ARTIFACT_IGNORE" --output "$tree/artifact.tgz" >/dev/null 2>&1 \
    || mise run //:log fatal "flux build artifact failed" path "$MISE_MONOREPO_ROOT"
tar -xzf "$tree/artifact.tgz" -C "$tree"
rm "$tree/artifact.tgz"
FLATE_ALLOW_MISSING_SECRETS=true flate build ks --path "$tree" --namespace "$usage_ns" --output yaml "$usage_ks"
'''

[tasks.restore-pvc]
description = "Restore a PVC from its latest kopiur snapshot (DESTRUCTIVE, deletes the PVC; offset 0 = latest)"
usage = '''
arg "<ns>" help="Namespace of the app"
arg "<ks>" help="Name of the Flux Kustomization that owns the PVC"
arg "<claim>" help="Name of the PVC"
arg "[offset]" default="0" help="Snapshot offset, 0 = latest"
'''
confirm = { message = "Delete PVC {{ usage.ns }}/{{ usage.claim }} and restore it from snapshot offset {{ usage.offset }}?", default = "no" }
run = '''
# Kopiur restore, as actually exercised on 2026-08-18. Order matters:
#
#  - The Restore CR pins its snapshot resolution at creation. A CR created
#    before the app's first snapshot pins resolution=NoSnapshot forever and
#    then silently populates an EMPTY volume while reporting Completed. So it
#    is deleted and recreated here, and the resolution is asserted at the end.
#  - openebs-zfs is WaitForFirstConsumer, so nothing is provisioned or
#    populated until a pod claims the PVC. The workload must be scaled back
#    UP to drive the restore - it cannot run with the app at zero.
#  - The PV is flipped to Retain first so a bad restore is recoverable. That
#    leaves an orphaned PV + ZFSVolume behind; the cleanup command is printed
#    at the end. Do not skip it, or the space stays leaked.
kc() { kubectl --context "$KUBE_CONTEXT" "$@"; }
PVC="$usage_claim"
NS="$usage_ns"

if ! kc -n "$NS" get pvc "$PVC" >/dev/null 2>&1; then
    mise run //:log fatal "no such PVC" ns "$NS" claim "$PVC"
fi

WORKLOADS=$(kc -n "$NS" get deploy,sts -o json \
    | jq -r --arg c "$PVC" '.items[]
        | select([.spec.template.spec.volumes[]? | select(.persistentVolumeClaim.claimName == $c)] | length > 0)
        | "\(.kind | ascii_downcase)/\(.metadata.name)=\(.spec.replicas)"')

if [[ -z "$WORKLOADS" ]]; then
    mise run //:log warn "no workload mounts this claim; one is required to drive the populator" claim "$PVC"
fi

PV=$(kc -n "$NS" get pvc "$PVC" -o jsonpath='{.spec.volumeName}')
mise run //:log info "retaining old volume as a safety net" pv "$PV"
kc patch pv "$PV" -p '{"spec":{"persistentVolumeReclaimPolicy":"Retain"}}'

for w in $WORKLOADS; do
    mise run //:log info "scaling down" workload "${w%%=*}"
    kc -n "$NS" scale "${w%%=*}" --replicas=0
done
# Scoped to pods actually mounting the claim - a namespace-wide wait would
# block on every unrelated app in the namespace.
for _ in $(seq 1 120); do
    USING=$(kc -n "$NS" get pods -o json \
        | jq --arg c "$PVC" '[.items[]
            | select([.spec.volumes[]? | select(.persistentVolumeClaim.claimName == $c)] | length > 0)]
            | length')
    [[ "$USING" == "0" ]] && break
    sleep 5
done

mise run //:log info "deleting PVC and stale Restore CR" claim "$PVC"
kc -n "$NS" delete pvc "$PVC" --timeout=5m
kc -n "$NS" delete restore "$PVC" --ignore-not-found --timeout=5m

# The component carries no ssa annotation, so Flux recreates both normally.
flux --context "$KUBE_CONTEXT" -n "$NS" reconcile kustomization "$usage_ks"
kc -n "$NS" wait restore "$PVC" --for=create --timeout=5m
kc -n "$NS" wait pvc "$PVC" --for=create --timeout=5m

if [[ "$usage_offset" != "0" ]]; then
    mise run //:log info "restoring an older snapshot" offset "$usage_offset"
    kc -n "$NS" patch restore "$PVC" --type=merge \
        -p "{\"spec\":{\"source\":{\"fromPolicy\":{\"offset\":$usage_offset}}}}"
fi

# WaitForFirstConsumer: scaling back up is what actually starts the restore.
for w in $WORKLOADS; do
    mise run //:log info "scaling up to drive the populator" workload "${w%%=*}" replicas "${w##*=}"
    kc -n "$NS" scale "${w%%=*}" --replicas="${w##*=}"
done

kc -n "$NS" wait pvc "$PVC" --for=jsonpath='{.status.phase}'=Bound --timeout=60m

# The failure this whole task exists to catch: a "successful" empty restore.
RESOLVED=$(kc -n "$NS" get restore "$PVC" -o json \
    | jq -c --arg c "$PVC" '.status.claims[$c].resolved // {}')
RESOLUTION=$(jq -r '.resolution // ""' <<<"$RESOLVED")
RESOLVED_ID=$(jq -r '.kopiaSnapshotID // ""' <<<"$RESOLVED")
if [[ "$RESOLUTION" != "Snapshot" ]]; then
    mise run //:log error "restore did NOT come from a snapshot - the volume is EMPTY" resolution "$RESOLUTION"
    mise run //:log fatal "old data is still on the retained PV" pv "$PV"
fi

POLICY=$(kc -n "$NS" get restore "$PVC" -o jsonpath='{.spec.source.fromPolicy.name}')
SNAPSHOT_IDS=$(kc -n "$NS" get snapshot -o json \
    | jq -r --arg p "$POLICY" '[.items[]
        | select(.spec.policyRef.name == $p and .status.phase == "Succeeded")]
        | sort_by(.metadata.creationTimestamp) | reverse
        | .[].status.snapshot.kopiaSnapshotID')
LATEST_ID=$(sed -n '1p' <<<"$SNAPSHOT_IDS")
WANTED_ID=$(sed -n "$((usage_offset + 1))p" <<<"$SNAPSHOT_IDS")
if [[ -z "$WANTED_ID" ]]; then
    mise run //:log error "no Succeeded snapshot at this offset" policy "$POLICY" offset "$usage_offset"
    mise run //:log fatal "old data is still on the retained PV" pv "$PV"
fi
if [[ "$usage_offset" != "0" && "$RESOLVED_ID" == "$LATEST_ID" ]]; then
    mise run //:log error "offset was $usage_offset but the restore used the LATEST snapshot" snapshot "$RESOLVED_ID"
    mise run //:log fatal "old data is still on the retained PV" pv "$PV"
fi
if [[ "$RESOLVED_ID" != "$WANTED_ID" ]]; then
    mise run //:log error "restore used a different snapshot than the offset names" used "$RESOLVED_ID" wanted "$WANTED_ID"
    mise run //:log fatal "old data is still on the retained PV" pv "$PV"
fi

for w in $WORKLOADS; do
    kc -n "$NS" rollout status "${w%%=*}" --timeout=15m
done
mise run //:log info "restore complete" claim "$PVC" resolution "$RESOLUTION"
# Printed rather than passed to the log task: gum parses a leading --flag inside
# a value as its own flag and exits non-zero.
mise run //:log warn "old volume retained - reclaim it once the data checks out" pv "$PV"
printf '  mise run --yes //kube/clusters/frostlink:reclaim-pv %s\n' "$PV"
'''

[tasks.towonel-invite]
description = "Create a towonel agent invite on the hub and print its token; the operator key never touches disk"
usage = '''
arg "<name>" help="Agent name, for example artemis"
flag "--tcp-ports <ports>" default="" help="Comma-separated TCP ports the agent may publish, for example 15001"
flag "--hostnames <hosts>" default="" help="Comma-separated hostnames the agent may claim"
'''
confirm = { message = "Create a towonel invite for {{ usage.name }}? The printed token is a credential.", default = "no" }
run = '''
body="$(jq -nc --arg n "$usage_name" --arg p "$usage_tcp_ports" --arg h "$usage_hostnames" \
    '{name: $n, hostnames: ($h | split(",") | map(select(. != ""))), tcp_ports: ($p | split(",") | map(select(. != "") | tonumber))}')"
key="$(kubectl --context "$KUBE_CONTEXT" -n towonel exec ds/towonel -c main -- cat /data/operator.key)"
curl -fsS -X POST https://hub.frostlink.dev/v1/invites \
    -H "Authorization: Bearer $key" -H 'content-type: application/json' -d "$body"
'''

[tasks.release-snapshot]
description = "Remove the cleanup finalizer from one kopiur Snapshot that is stuck deleting; its data stays in the repository"
usage = '''
arg "<ns>" help="Namespace of the Snapshot"
arg "<snapshot>" help="Name of the Snapshot"
'''
confirm = { message = "Remove the finalizer from Snapshot {{ usage.ns }}/{{ usage.snapshot }}? kopiur will not clean it out of the repository.", default = "no" }
run = '''
deleting="$(kubectl --context "$KUBE_CONTEXT" -n "$usage_ns" get snapshot "$usage_snapshot" -o jsonpath='{.metadata.deletionTimestamp}')"
if [[ -z "$deleting" ]]; then
    mise run //:log fatal "Snapshot is not being deleted, so nothing is stuck" ns "$usage_ns" snapshot "$usage_snapshot"
    exit 1
fi
kubectl --context "$KUBE_CONTEXT" -n "$usage_ns" patch snapshot "$usage_snapshot" --type=merge -p '{"metadata":{"finalizers":null}}'
mise run //:log warn "Finalizer removed; the kopia snapshot may stay in the repository until maintenance" ns "$usage_ns" snapshot "$usage_snapshot"
'''

[tasks.reclaim-pv]
description = "Delete a released PV and its ZFS volume after restore-pvc, once the restored data is confirmed good"
usage = 'arg "<pv>" help="The retained PV that restore-pvc printed"'
confirm = { message = "Delete PV {{ usage.pv }} and its ZFS volume? This is the only copy of the pre-restore data.", default = "no" }
run = '''
kc() { kubectl --context "$KUBE_CONTEXT" "$@"; }
phase="$(kc get pv "$usage_pv" -o jsonpath='{.status.phase}')"
if [[ "$phase" != "Released" ]]; then
    mise run //:log fatal "PV is not Released, so something still uses it" pv "$usage_pv" phase "$phase"
    exit 1
fi
kc delete pv "$usage_pv"
kc -n openebs-system delete zfsvolume "$usage_pv" --ignore-not-found
mise run //:log info "Reclaimed" pv "$usage_pv"
'''

[tasks.snapshot-pvc]
description = "Take an on-demand kopiur snapshot of one PVC and wait for it"
usage = '''
arg "<ns>" help="Namespace of the PVC"
arg "<claim>" help="Name of the PVC; its SnapshotPolicy carries the same name"
'''
run = '''
NAME="$usage_claim-manual-$(date -u +%Y%m%d%H%M%S)"
mise run //:log info "Snapshotting" ns "$usage_ns" policy "$usage_claim"
kubectl --context "$KUBE_CONTEXT" apply --server-side -f - <<EOF
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  name: $NAME
  namespace: $usage_ns
spec:
  description: on-demand snapshot via \`mise run //kube/clusters/frostlink:snapshot-pvc\`
  policyRef:
    name: $usage_claim
EOF
kubectl --context "$KUBE_CONTEXT" -n "$usage_ns" wait snapshot "$NAME" \
    --for=jsonpath='{.status.phase}'=Succeeded --timeout=120m
kubectl --context "$KUBE_CONTEXT" -n "$usage_ns" get snapshot "$NAME" -o jsonpath='{.status.logTail}{"\n"}'
'''
