env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare
        key: CF_TOKEN
  - name: CF_ZONE_ID
    valueFrom:
      secretKeyRef:
        name: cloudflare
        key: CF_ZONE_ID
extraArgs:
  - --cloudflare-dns-records-per-page=1000
  - --cloudflare-proxied
  - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
  - --crd-source-kind=DNSEndpoint
  - --gateway-name=external-gateway
  - --zone-id-filter=$(CF_ZONE_ID)
txtOwnerId: artemis-cluster
domainFilters:
  - dcunha.io
serviceMonitor:
  enabled: true
podAnnotations:
  secret.reloader.stakater.com/reload: cloudflare
