---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgesync
spec:
  chartRef:
    kind: OCIRepository
    name: forgesync
  interval: 30m
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: forgejo-registry-pull
    controllers:
      forgesync:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
        containers:
          app:
            image:
              repository: git.dcunha.io/exikle/forgesync
              tag: 0.0.6@sha256:6e4b553e8f787aa6ab207396193c788529c22615a28b5d36c7c2ed97a0d05e78
            args:
              - run
            env:
              FORGESYNC_SOURCE_URL: http://forgejo.external-endpoints.svc.cluster.local:3000
              FORGESYNC_BOT_USERNAME: dusk-bot
              FORGESYNC_INITIAL_BACKFILL: 24h
              FORGESYNC_LOG_FORMAT: json
            envFrom:
              - secretRef:
                  name: forgesync-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 5
                  periodSeconds: 30
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    externalSecrets:
      env:
        refreshInterval: 5m
        dataFrom:
          - extract:
              key: forgejo
          - extract:
              key: github
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: forgesync-secret
          template:
            data:
              FORGESYNC_SOURCE_TOKEN: "{{ .DUSK_BOT_CLUSTER_TOKEN }}"
              FORGESYNC_GITHUB_TOKEN: "{{ .GITHUB_PAT }}"
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
            path: /metrics
            interval: 60s
            scrapeTimeout: 15s
