---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
  interval: 30m
  values:
    controllers:
      runner:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        serviceAccount:
          identifier: runner
        pod:
          automountServiceAccountToken: true
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          terminationGracePeriodSeconds: 300
        initContainers:
          k8s-plugin:
            image:
              repository: registry.erwanleboucher.dev/eleboucher/runner-k8s-plugin
              tag: "13.2.2@sha256:403b5348a38934eae4b06011a457fcdeae3d16df1074eb758b8b31c10f837d76"
            args:
              - --listen
              - unix:///plugin/forgejo-runner-k8s.sock
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
              limits:
                memory: 512Mi
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
        containers:
          app:
            image:
              repository: data.forgejo.org/forgejo/runner
              tag: "13.2.2@sha256:a8543a45fe62bebef0534d5c223cf485d3294e6dd2e42a82dbcbfd40c54a6a22"
            command:
              - sh
              - -ec
              - |
                exec /bin/forgejo-runner daemon \
                  --config /config/runner.yaml \
                  --url "http://forgejo.external-endpoints.svc.cluster.local:3000" \
                  --uuid "$(cat /etc/forgejo-runner-secret/uuid)" \
                  --token-url file:///etc/forgejo-runner-secret/token
            resources:
              requests:
                cpu: 5m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
        forceRename: forgejo-runner-k8s
    externalSecrets:
      token:
        dataFrom:
          - extract:
              key: forgejo
        refreshInterval: 5m
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: forgejo-runner-token
          template:
            data:
              token: "{{ .FORGEJO_RUNNER_TOKEN }}"
              uuid: "{{ .FORGEJO_RUNNER_UUID }}"
        forceRename: forgejo-runner-token
    persistence:
      config:
        type: configMap
        advancedMounts:
          runner:
            app:
              - path: /config
            k8s-plugin:
              - path: /config
                readOnly: true
        name: forgejo-runner-configmap
      data:
        type: emptyDir
        advancedMounts:
          runner:
            app:
              - path: /data
            k8s-plugin:
              - path: /data
                readOnly: true
      plugin:
        type: emptyDir
        globalMounts:
          - path: /plugin
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      token:
        type: secret
        name: forgejo-runner-token
        advancedMounts:
          runner:
            app:
              - path: /etc/forgejo-runner-secret
                readOnly: true
    rawResources:
      talos:
        manifest:
          apiVersion: talos.dev/v1alpha1
          kind: ServiceAccount
          spec:
            roles:
              - os:admin
        forceRename: forgejo-runner-talos-api
    rbac:
      bindings:
        runner:
          type: RoleBinding
          roleRef:
            identifier: runner
          subjects:
            - identifier: runner
      roles:
        runner:
          type: Role
          rules:
            - apiGroups: ["batch"]
              resources: ["jobs"]
              verbs: ["create", "get", "list", "watch", "delete"]
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["pods/exec"]
              verbs: ["create", "get"]
            - apiGroups: [""]
              resources: ["pods/log"]
              verbs: ["get", "list", "watch"]
    serviceAccount:
      runner: {}
