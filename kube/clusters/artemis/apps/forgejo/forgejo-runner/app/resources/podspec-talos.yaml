containers:
  - env:
      - name: DEBIAN_FRONTEND
        value: noninteractive
      - name: NODE
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
    image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:8b7a25c7b3235c27e97df1cbb8411c1d12d2676e739265b5fbb66bb55f72dbf6
    imagePullPolicy: IfNotPresent
    name: main
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 256Mi
    volumeMounts:
      - mountPath: /var/run/secrets/talos.dev
        name: talos
        readOnly: true
volumes:
  - name: talos
    secret:
      secretName: forgejo-runner-talos-api
restartPolicy: Never
