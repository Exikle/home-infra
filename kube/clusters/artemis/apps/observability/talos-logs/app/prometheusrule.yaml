---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: talos-logs
spec:
  groups:
    - name: talos-logs
      rules:
        - alert: TalosLogsNotShipping
          expr: |-
            max by (pod) (
              (increase(fluentbit_output_errors_total{job="talos-logs", name="victorialogs"}[30m]) > 0)
              or
              (increase(fluentbit_output_dropped_records_total{job="talos-logs", name="victorialogs"}[30m]) > 0)
              or
              (last_over_time(fluentbit_storage_fs_chunks{job="talos-logs"}[5m]) > 10)
            )
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.pod }} cannot deliver the Talos logs of its node to VictoriaLogs"
