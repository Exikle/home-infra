---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana
spec:
  targetNamespace: observability
  path: ./kube/clusters/artemis/apps/observability/grafana/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: grafana
  interval: 1h
  dependsOn:
    - name: pocket-id-operator
      namespace: security
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-instance
spec:
  targetNamespace: observability
  path: ./kube/clusters/artemis/apps/observability/grafana/instance
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: grafana
  interval: 1h
  dependsOn:
    - name: grafana
  components:
    - ../../../../components/postgres/app
  postBuild:
    substitute:
      APP: grafana
  wait: false
