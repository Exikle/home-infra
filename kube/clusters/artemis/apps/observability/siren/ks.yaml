# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: siren
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: siren
  path: ./kube/clusters/artemis/apps/observability/siren/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: siren
  interval: 1h
  dependsOn:
    - name: kanidm-operator
      namespace: security
    - name: pocket-id-operator
      namespace: security
  components:
    - ../../../../components/envoy-oidc
  postBuild:
    substitute:
      APP: siren
      OIDC_CLIENT_SECRET: siren-kanidm-oauth2-credentials
      OIDC_ISSUER: idm.dcunha.io/oauth2/openid/siren
  wait: true
