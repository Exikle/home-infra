---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus-sidecar
spec:
  chartRef:
    kind: OCIRepository
    name: gatus-sidecar
  interval: 1h
  values:
    config:
      existingConfigMap: "{{ .Release.Name }}-configmap"
      items:
        - key: cluster-endpoints.yaml
          path: cluster-endpoints.yaml
        - key: config.yaml
          path: config.yaml
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    dnsConfig:
      options:
        - name: ndots
          value: "1"
    gatus:
      envFrom:
        - secretRef:
            name: gatus
    initContainers:
      - name: push
        image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
        command:
          - /bin/sh
          - /scripts/push.sh
        env:
          - name: GATUS_WEB_PORT
            value: "8080"
          - name: HOME_PUSH_TOKEN
            valueFrom:
              secretKeyRef:
                name: gatus
                key: HOME_PUSH_TOKEN
          - name: PUSH_URL
            value: https://status.dcunha.io/api/v1/home-push
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
          - mountPath: /scripts
            name: push-script
            readOnly: true
    sidecar:
      kinds:
        httproute:
          enable: true
    volumes:
      - name: push-script
        configMap:
          name: gatus-sidecar-configmap
          items:
            - key: push.sh
              path: push.sh
