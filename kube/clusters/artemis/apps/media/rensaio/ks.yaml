---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rensaio
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kube/clusters/artemis/apps/media/rensaio/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: rensaio
  interval: 1h
  retryInterval: 1m
  components:
    - ../../../../components/zeroscaler
    - ../../../../components/kopiur/statefulset
  postBuild:
    substitute:
      APP: *app
      CONTROLLER: StatefulSet
      KOPIUR_PGID: "100"
      KOPIUR_PUID: "99"
      KOPIUR_SNAPSHOTCLASS: miroir
  wait: false
