---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app thelounge
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kube/clusters/artemis/apps/media/thelounge/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: thelounge
  interval: 1h
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 2Gi
      KOPIUR_SNAPSHOTCLASS: miroir
      KOPIUR_STORAGECLASS: miroir
  wait: false
