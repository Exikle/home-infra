---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bazarr
spec:
  chartRef:
    kind: OCIRepository
    name: bazarr
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      bazarr:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        statefulset:
          podManagementPolicy: Parallel
          volumeClaimTemplates:
            - name: config
              accessMode: ReadWriteOnce
              dataSourceRef:
                apiGroup: kopiur.home-operations.com
                kind: Restore
                name: "{{ .Release.Name }}"
              size: 2Gi
              storageClass: miroir
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/bazarr
              tag: 1.6.2@sha256:6c40dfa683f767d28d1dc502837ed0a5a57682a84231f03e704e2b3f61b25a46
            env:
              BAZARR__PORT: &port 80
              PGSSLMODE: verify-full
              PGSSLROOTCERT: /var/run/secrets/postgres-server-ca/ca.crt
              POSTGRES_DATABASE: bazarr
              POSTGRES_ENABLED: "true"
              POSTGRES_HOST: postgres-19-rw.database.svc
              POSTGRES_PORT: "5432"
              POSTGRES_USERNAME: bazarr
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    key: POSTGRES_PASSWORD
                    name: bazarr-postgres
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/system/ping
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    externalSecrets:
      oidc:
        forceRename: bazarr-tinyauth-oidc
        dataFrom:
          - extract:
              key: tinyauth
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              client-secret: "{{ .BAZARR_CLIENT_SECRET }}"
    persistence:
      media:
        type: nfs
        path: /mnt/atlas/media
        server: 10.10.99.100
        globalMounts:
          - path: /media
      tmp:
        type: emptyDir
        advancedMounts:
          bazarr:
            app:
              - path: /tmp
                subPath: tmp
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "{{ .Release.Name }}.dcunha.io"
        parentRefs:
          - name: internal-gateway
            namespace: network
    service:
      app:
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |-
            url: "https://bazarr.dcunha.io/api/system/ping"
            client:
              ignore-redirect: true
            group: internal
            conditions: ["[STATUS] == 302"]
            ui:
              hide-hostname: true
              hide-url: true
        ports:
          http:
            port: *port
