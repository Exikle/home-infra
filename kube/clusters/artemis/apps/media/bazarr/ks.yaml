---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bazarr
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kube/clusters/artemis/apps/media/bazarr/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: bazarr
  interval: 1h
  dependsOn:
    - name: pocket-id-operator
      namespace: security
  components:
    - ../../../../components/zeroscaler
    - ../../../../components/kopiur/statefulset
    - ../../../../components/postgres/app
    - ../../../../components/envoy-oidc
    - ../../../../components/envoy-oidc-groups
  postBuild:
    substitute:
      APP: *app
      CONTROLLER: StatefulSet
      KOPIUR_SNAPSHOTCLASS: miroir
      OIDC_CLIENT_SECRET: bazarr-tinyauth-oidc
      OIDC_ISSUER: auth.dcunha.io
  wait: false
