---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: kritika-19
spec:
  cluster:
    name: postgres-19
  databaseRoleReclaimPolicy: retain
  login: true
  name: kritika
  passwordSecret:
    name: kritika-postgres
  superuser: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: kritika-app-19
spec:
  cluster:
    name: postgres-19
  databaseRoleReclaimPolicy: retain
  login: true
  name: kritika_app
  passwordSecret:
    name: kritika-app-postgres
  superuser: false
