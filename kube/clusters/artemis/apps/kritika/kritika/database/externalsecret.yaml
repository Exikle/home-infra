---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres
spec:
  dataFrom:
    - extract:
        key: postgres-artemis
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: ""
      data:
        username: kritika
        password: "{{ .password }}"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-app-postgres
spec:
  dataFrom:
    - extract:
        key: postgres-artemis
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-app-postgres
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: ""
      data:
        username: kritika_app
        password: "{{ .password }}"
