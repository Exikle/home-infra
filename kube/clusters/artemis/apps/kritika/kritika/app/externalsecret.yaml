---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika
spec:
  dataFrom:
    - extract:
        key: kritika
    - extract:
        key: forgejo
    - extract:
        key: agentgateway
    - extract:
        key: cliproxyapi
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika
    template:
      data:
        ADMIN_PASSWORD: "{{ .KRITIKA_ADMIN_PASSWORD }}"
        CLIPROXY_API_KEY: "{{ .CLIPROXYAPI_API_KEY }}"
        FORGEJO_PRIVATE_KEY: "{{ .KRITIKA_FORGEJO_PRIVATE_KEY }}"
        FORGEJO_WEBHOOK_SECRET: "{{ .KRITIKA_WEBHOOK_SECRET }}"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-database-owner
spec:
  dataFrom:
    - extract:
        key: postgres-artemis
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-database-owner
    template:
      data:
        uri: "postgres://kritika:{{ .password }}@postgres-rw.database.svc:5432/kritika?sslmode=require&connect_timeout=10"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-database-app
spec:
  dataFrom:
    - extract:
        key: postgres-artemis
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-database-app
    template:
      data:
        uri: "postgres://kritika_app:{{ .password }}@postgres-rw.database.svc:5432/kritika?sslmode=require&connect_timeout=10"
