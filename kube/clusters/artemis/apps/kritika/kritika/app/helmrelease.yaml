# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  values:
    config:
      auth:
        admin:
          password:
            env: ADMIN_PASSWORD
      confidence:
        gate:
          when:
            - name: renovate
              expr: pr.headRef.startsWith("renovate/")
        model: agentgateway/opencode-go/glm-5.2
        threshold: 4
      forgejo:
        forgejo:
          accounts:
            - exikle
          bots:
            - dusk-bot
          host: git.dcunha.io
          privateKey:
            env: FORGEJO_PRIVATE_KEY
          webhookSecret:
            env: FORGEJO_WEBHOOK_SECRET
      providers:
        agentgateway:
          apiKey:
            env: AGENTGATEWAY_API_KEY
          baseUrl: http://agentgateway.cortex.svc.cluster.local:4000/v1
          type: openai
      review:
        model: agentgateway/opencode-go/minimax-m3
      webUrl: https://kritika.dcunha.io
    database:
      app:
        existingSecret: kritika-database-app
      owner:
        existingSecret: kritika-database-owner
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    envFrom:
      - secretRef:
          name: kritika
    httpRoute:
      enabled: true
      hostnames:
        - kritika.dcunha.io
      parentRefs:
        - name: internal-gateway
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    networkPolicy:
      extraEgress:
        - ports:
            - port: 4000
              protocol: TCP
          to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: cortex
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
