# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  values:
    config:
      auth:
        admin:
          password:
            env: ADMIN_PASSWORD
        oidc:
          clientId: kritika
          clientSecret:
            env: OIDC_CLIENT_SECRET
          issuer: https://id.dcunha.io
          name: Pocket-ID
          roleMappingExpr: '"app_admin" in roles ? "admin" : ""'
          rolesClaim: groups
          scopes:
            - openid
            - email
            - profile
            - groups
      confidence:
        effort: low
        fallback: agentgateway/opencode-go/minimax-m3
        gate:
          when:
            - name: renovate
              expr: pr.headRef.startsWith("renovate/")
        model: agentgateway/opencode-go/glm-5.2
        threshold: 4
      egress:
        allow:
          - 10.10.99.90
          - api.github.com
          - auth.docker.io
          - codeberg.org
          - cr.agentgateway.dev
          - ghcr.io
          - git.erwanleboucher.dev
          - github.com
          - gsoci.azurecr.io
          - mirror.gcr.io
          - objects.githubusercontent.com
          - pkg-containers.githubusercontent.com
          - production.cloudflare.docker.com
          - quay.io
          - raw.githubusercontent.com
          - registry-1.docker.io
          - registry.erwanleboucher.dev
          - release-assets.githubusercontent.com
      forgejo:
        forgejo:
          accounts:
            - exikle
          audience: u:4:82134243-5108-4c8f-8d47-267c9c1d2164
          bots:
            - dusk-bot
          host: git.dcunha.io
          privateKey:
            env: FORGEJO_PRIVATE_KEY
          runnerAudience: u:4:0323bdad-346c-409f-b65e-095237e030d3
          webhookSecret:
            env: FORGEJO_WEBHOOK_SECRET
      providers:
        agentgateway:
          apiKey:
            env: AGENTGATEWAY_API_KEY
          baseUrl: http://agentgateway.cortex.svc.cluster.local:4000/v1
          concurrency: 1
          retries: 2
          type: openai
      review:
        model: agentgateway/opencode-go/minimax-m3
      webUrl: https://kritika.dcunha.io
    database:
      app:
        existingSecret: kritika-database-app
      owner:
        existingSecret: kritika-database-owner
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    envFrom:
      - secretRef:
          name: kritika
      - secretRef:
          name: kritika-oidc-credentials
    httpRoute:
      enabled: true
      hostnames:
        - kritika.dcunha.io
      parentRefs:
        - name: internal-gateway
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    networkPolicy:
      extraEgress:
        - ports:
            - port: 4000
              protocol: TCP
          to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: cortex
        - ports:
            - port: 10443
              protocol: TCP
          to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: network
              podSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: edge-gateway
      postgres:
        namespace: database
        podSelector:
          cnpg.io/cluster: postgres
