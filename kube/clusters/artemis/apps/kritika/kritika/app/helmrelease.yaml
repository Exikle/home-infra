# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  values:
    config:
      auth:
        admin:
          password:
            env: ADMIN_PASSWORD
        oidc:
          clientId: kritika
          clientSecret:
            env: OIDC_CLIENT_SECRET
          issuer: https://id.dcunha.io
          name: Pocket-ID
          roleMappingExpr: '"app_admin" in roles ? "admin" : ""'
          rolesClaim: groups
          scopes:
            - openid
            - email
            - profile
            - groups
      confidence:
        effort: low
        fallback: opencode/minimax-m3
        gate:
          when:
            - name: bot
              expr: pr.bot
        instructions: Write the reason as one short sentence of at most 25 words, in plain words. Name the single main risk only. Do not list what the review read or checked.
        model: opencode/glm-5.2
        threshold: 4
      egress:
        allow:
          - 10.10.99.90
          - api.github.com
          - auth.docker.io
          - codeberg.org
          - cr.agentgateway.dev
          - dock.mau.dev
          - ghcr.io
          - git.erwanleboucher.dev
          - github.com
          - gsoci.azurecr.io
          - mirror.gcr.io
          - objects.githubusercontent.com
          - pkg-containers.githubusercontent.com
          - production.cloudflare.docker.com
          - quay.io
          - raw.githubusercontent.com
          - registry-1.docker.io
          - registry.erwanleboucher.dev
          - registry.opentofu.org
          - release-assets.githubusercontent.com
      forgejo:
        forgejo:
          accounts:
            - exikle
          audience: u:4:82134243-5108-4c8f-8d47-267c9c1d2164
          bots:
            - dusk-bot
          host: git.dcunha.io
          privateKey:
            env: FORGEJO_PRIVATE_KEY
          runnerAudience: u:4:0323bdad-346c-409f-b65e-095237e030d3
          webhookSecret:
            env: FORGEJO_WEBHOOK_SECRET
      providers:
        claude:
          apiKey:
            env: CLIPROXY_API_KEY
          baseUrl: http://cliproxyapi.cortex.svc.cluster.local:8317
          concurrency: 1
          pricing:
            claude-haiku-5-5:
              cacheRead: 0.01
              cacheWrite: 0.125
              input: 0.1
              output: 0.5
          retries: 2
          type: anthropic
        opencode:
          apiKey:
            env: OPENCODE_API_KEY
          concurrency: 1
          pricing:
            glm-5.2:
              cacheRead: 0.26
              input: 1.4
              output: 4.4
            minimax-m3:
              cacheRead: 0.06
              input: 0.3
              output: 1.2
          retries: 2
          type: opencode
      review:
        agents:
          - categories:
              - correctness
              - security
              - performance
              - reliability
              - compatibility
              - accessibility
              - maintainability
              - tests
            model: claude/claude-haiku-5-5
            name: haiku
        model: opencode/minimax-m3
      webUrl: https://kritika.dcunha.io
    database:
      app:
        existingSecret: kritika-database-app
      owner:
        existingSecret: kritika-database-owner
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    envFrom:
      - secretRef:
          name: kritika
      - secretRef:
          name: kritika-oidc-credentials
    httpRoute:
      enabled: true
      hostnames:
        - kritika.dcunha.io
      parentRefs:
        - name: internal-gateway
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    networkPolicy:
      extraEgress:
        - ports:
            - port: 8317
              protocol: TCP
          to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: cortex
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: cliproxyapi
        - ports:
            - port: 10443
              protocol: TCP
          to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: network
              podSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: edge-gateway
      postgres:
        namespace: database
        podSelector:
          cnpg.io/cluster: postgres
