---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: apps
spec:
  discoveryFilters:
    - "!Exikle/containers"
    - "!Exikle/dotfiles"
    - "!Exikle/extensions-default"
    - "!Exikle/fingerjoin"
    - "!Exikle/forgesync"
    - "!Exikle/home-infra"
    - "!Exikle/Rensaio"
    - "!Exikle/silo-plugins-requests-seerr"
  schedule: 15 4-10 * * 1
  templateRef:
    name: default
