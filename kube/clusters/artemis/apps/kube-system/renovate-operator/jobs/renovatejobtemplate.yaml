---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/renovate-operator.mogenius.com/renovatejobtemplate_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJobTemplate
metadata:
  name: default
spec:
  extraEnv:
    - name: RENOVATE_BRANCH_PREFIX
      value: "renovate-"
    - name: RENOVATE_GIT_AUTHOR
      value: "dusk-bot <171887436+dusk-bot[bot]@users.noreply.github.com>"
    - name: LOG_LEVEL
      value: debug
    - name: RENOVATE_CACHE_DIR
      value: /cache
    - name: RENOVATE_CACHE_PRIVATE_PACKAGES
      value: "true"
    - name: RENOVATE_CACHE_TTL_OVERRIDE
      value: '{"datasource-docker-tags": 360, "datasource-docker-releases-v2": 360}'
    - name: RENOVATE_REDIS_URL
      value: redis://dragonfly.database.svc:6379/3
    - name: RENOVATE_REPOSITORY_CACHE
      value: enabled
  extraVolumeMounts:
    - name: cache
      mountPath: /cache
  extraVolumes:
    - name: cache
      nfs:
        server: 10.10.99.100
        path: /mnt/atlas/renovate-cache
  image: ghcr.io/renovatebot/renovate:44.257.9@sha256:d6b65ff3562dd499240b23d34ef806ec7e5fd2675e4236a027dfb36774f2aa75
  parallelism: 1
  provider:
    name: forgejo
    endpoint: https://git.dcunha.io/api/v1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  secretRef: renovate-secret
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-secret
        key: RENOVATE_WEBHOOK_TOKEN
