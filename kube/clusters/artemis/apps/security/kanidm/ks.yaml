---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kanidm-operator
spec:
  targetNamespace: security
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kube/clusters/artemis/apps/security/kanidm/operator
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: kanidm
  interval: 1h
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kanidm
spec:
  targetNamespace: security
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kube/clusters/artemis/apps/security/kanidm/instance
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: kanidm
  interval: 1h
  dependsOn:
    - name: kanidm-operator
  components:
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_SNAPSHOTCLASS: miroir
      KOPIUR_STORAGECLASS: miroir
  wait: true
  healthCheckExprs:
    - apiVersion: kaniop.rs/v1beta1
      kind: Kanidm
      current: status.conditions.exists(c, c.type == 'Available' && c.status == 'True')
      failed: status.conditions.exists(c, c.type == 'Available' && c.status == 'False')
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kanidm-people
spec:
  targetNamespace: security
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kube/clusters/artemis/apps/security/kanidm/people
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: kanidm
  interval: 1h
  dependsOn:
    - name: kanidm
  wait: true
