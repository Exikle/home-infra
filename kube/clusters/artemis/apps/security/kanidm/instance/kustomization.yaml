---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./certificate.yaml
  - ./kanidm.yaml
  - ./pushsecret.yaml
patches:
  - patch: |-
      - op: replace
        path: /metadata/name
        value: ${APP}-data-${APP}-default-0
    target:
      kind: PersistentVolumeClaim
  - patch: |-
      - op: replace
        path: /spec/sources/0/pvc/name
        value: ${APP}-data-${APP}-default-0
    target:
      kind: SnapshotPolicy
