---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  certificates:
    clientCASecret: postgres-client-ca
    replicationTLSSecret: postgres-replication-cert
    serverCASecret: postgres-server-ca
    serverTLSSecret: postgres-server-cert
  enableSuperuserAccess: true
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:5827829071060876c4029650c04183e4ee562da3ebb9e88c914d67c8dc8669d6
  instances: 2
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: r2-store
  postgresql:
    extensions:
      - dynamic_library_path:
          - /usr/lib/postgresql/18/lib/
        extension_control_path:
          - /usr/share/postgresql/18/
        image:
          reference: ghcr.io/home-operations/vchord:1.5.0@sha256:97b4a1aa15b65c29fa97e84b4270cb235e7bd39e80d4a4b2e91d9fa17997566d
        name: vchord
    parameters:
      archive_timeout: 900s
      checkpoint_timeout: 30min
      maintenance_work_mem: 128MB
      max_connections: "200"
      max_wal_size: 2GB
      shared_buffers: 256MB
    pg_hba:
      - hostssl all all all scram-sha-256
    shared_preload_libraries:
      - vchord
  primaryUpdateMethod: switchover
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 4Gi
  storage:
    size: 40Gi
    storageClass: miroir
  walStorage:
    size: 8Gi
    storageClass: miroir
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-19
spec:
  bootstrap:
    initdb:
      import:
        type: monolith
        databases:
          - alcove
          - apoci
          - atuin
          - autobrr
          - autopulse
          - bazarr
          - grafana
          - home-assistant
          - immich
          - kritika
          - memini
          - paperless
          - pocket-id
          - prowlarr
          - qui
          - radarr
          - seerr
          - signet
          - silo
          - sonarr
          - sparkyfitness
          - tinyauth
        roles:
          - alcove
          - apoci
          - atuin
          - autobrr
          - autopulse
          - bazarr
          - grafana
          - home-assistant
          - immich
          - kritika
          - kritika_app
          - memini
          - paperless
          - pocket-id
          - prowlarr
          - qui
          - radarr
          - seerr
          - signet
          - silo
          - sonarr
          - sparkyfitness
          - sparkyfitness-app
          - tinyauth
        source:
          externalCluster: postgres
  certificates:
    clientCASecret: postgres-client-ca
    replicationTLSSecret: postgres-replication-cert
    serverCASecret: postgres-server-ca
    serverTLSSecret: postgres-19-server-cert
  externalClusters:
    - name: postgres
      connectionParameters:
        dbname: postgres
        host: postgres-rw.database.svc.cluster.local
        sslmode: require
        user: postgres
      password:
        name: postgres-superuser
        key: password
  imageName: ghcr.io/cloudnative-pg/postgresql:19.0-standard-trixie@sha256:6f17393bf934a41fec47439306a17e087c5c2f419ddd5bf4b8dc0241da4bceb0
  instances: 2
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: r2-store
  postgresql:
    extensions:
      - dynamic_library_path:
          - /usr/lib/postgresql/19/lib/
        extension_control_path:
          - /usr/share/postgresql/19/
        image:
          reference: ghcr.io/home-operations/vchord:1.5.0@sha256:97b4a1aa15b65c29fa97e84b4270cb235e7bd39e80d4a4b2e91d9fa17997566d
        name: vchord
    parameters:
      archive_timeout: 900s
      checkpoint_timeout: 30min
      maintenance_work_mem: 128MB
      max_connections: "200"
      max_wal_size: 2GB
      shared_buffers: 256MB
    pg_hba:
      - hostssl all all all scram-sha-256
    shared_preload_libraries:
      - vchord
  primaryUpdateMethod: switchover
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 4Gi
  storage:
    size: 40Gi
    storageClass: miroir
  walStorage:
    size: 8Gi
    storageClass: miroir
