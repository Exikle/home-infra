---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app komga
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kube/clusters/artemis/apps/default/komga/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: komga
  interval: 1h
  dependsOn:
    - name: pocket-id-operator
      namespace: security
  components:
    - ../../../../components/zeroscaler
    - ../../../../components/kopiur/statefulset
  postBuild:
    substitute:
      APP: *app
      CONTROLLER: StatefulSet
      KOPIUR_SNAPSHOTCLASS: miroir
  wait: false
