---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  chartRef:
    kind: OCIRepository
    name: llmkube
  interval: 30m
  values:
    controllerManager:
      leaderElection:
        enabled: false
      replicaCount: 1
      resources:
        limits:
          memory: 256Mi
        requests:
          memory: 128Mi
      securityContext:
        capabilities:
          drop:
            - ALL
    metrics:
      secure: false
    modelCache:
      enabled: true
      mode: perService
      size: 4Gi
      storageClass: miroir
    namespace: cortex
    prometheus:
      inferencePodMonitor:
        enabled: true
        additionalLabels: {}
      serviceMonitor:
        enabled: true
        additionalLabels: {}
