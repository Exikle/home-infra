---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../../base/external-secrets/onepassword-connect/app
patches:
  - target:
      kind: ClusterSecretStore
      name: onepassword-connect
    patch: |-
      - op: add
        path: /spec/provider/onepassword/vaults/artemis
        value: 1
      - op: add
        path: /spec/provider/onepassword/vaults/frostlink
        value: 3
  - target:
      kind: HelmRelease
      name: onepassword-connect
    patch: |-
      - op: add
        path: /spec/values/connect/api/serviceMonitor
        value:
          enabled: true
