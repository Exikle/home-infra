---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app agentgateway-crds
spec:
  targetNamespace: agentgateway-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kube/clusters/artemis/apps/agentgateway-system/agentgateway/crds
  prune: false
  sourceRef:
    kind: ExternalArtifact
    name: agentgateway
  interval: 1h
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app agentgateway
spec:
  targetNamespace: agentgateway-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kube/clusters/artemis/apps/agentgateway-system/agentgateway/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: agentgateway
  interval: 1h
  wait: true
