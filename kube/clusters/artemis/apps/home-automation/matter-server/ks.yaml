---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app matter-server
spec:
  targetNamespace: home-automation
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kube/clusters/artemis/apps/home-automation/matter-server/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: matter-server
  interval: 1h
  components:
    - ../../../../components/kopiur/statefulset
  postBuild:
    substitute:
      APP: matter-server
      KOPIUR_SNAPSHOTCLASS: miroir
  wait: false
