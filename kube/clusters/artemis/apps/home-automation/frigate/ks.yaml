---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app frigate
spec:
  targetNamespace: home-automation
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kube/clusters/artemis/apps/home-automation/frigate/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: frigate
  interval: 1h
  components:
    - ../../../../components/kopiur/statefulset
    - ../../../../components/tinyauth
  postBuild:
    substitute:
      APP: *app
      KOPIUR_PGID: "0"
      KOPIUR_PUID: "0"
      KOPIUR_SNAPSHOTCLASS: miroir
  wait: false
