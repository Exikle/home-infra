---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zigbee
spec:
  targetNamespace: home-automation
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kube/clusters/artemis/apps/home-automation/zigbee/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: zigbee
  interval: 1h
  dependsOn:
    - name: kanidm-operator
      namespace: security
    - name: pocket-id-operator
      namespace: security
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/envoy-oidc
    - ../../../../components/envoy-oidc-groups
  postBuild:
    substitute:
      APP: zigbee
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_SNAPSHOTCLASS: miroir
      KOPIUR_STORAGECLASS: miroir
      OIDC_CLIENT_SECRET: zigbee-tinyauth-oidc
      OIDC_ISSUER: auth.dcunha.io
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zigbee-watchdog
spec:
  targetNamespace: home-automation
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kube/clusters/artemis/apps/home-automation/zigbee/watchdog
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: zigbee
  interval: 1h
  wait: true
