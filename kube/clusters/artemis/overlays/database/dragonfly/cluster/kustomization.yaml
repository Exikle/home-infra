---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../../base/database/dragonfly/cluster
  - ./networkpolicy-clients.yaml
patches:
  - target:
      kind: Dragonfly
      name: dragonfly
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/args
        value:
          - --admin_bind=0.0.0.0
          - --cluster_mode=emulated
          - --default_lua_flags=allow-undeclared-keys
          - --lock_on_hashtags
          - --maxmemory=$(MAX_MEMORY)Mi
          - --proactor_threads=2
