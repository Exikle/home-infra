---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app apoci
spec:
  targetNamespace: fediverse
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kube/clusters/${CLUSTER}/apps/fediverse/apoci/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: apoci
  interval: 1h
  components:
    - ../../../../components/kopiur/statefulset
    - ../../../../components/postgres/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CLAIM: data
      KOPIUR_SNAPSHOTCLASS: miroir
  wait: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: apoci
      namespace: fediverse
