---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  chartRef:
    kind: OCIRepository
    name: external-secrets
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: external-secrets-values
      optional: true
  values:
    image:
      repository: &image ghcr.io/external-secrets/external-secrets
    webhook:
      image:
        repository: *image
    certController:
      image:
        repository: *image
