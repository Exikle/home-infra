---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
spec:
  chartRef:
    kind: OCIRepository
    name: metrics-server
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: metrics-server-values
      optional: true
      valuesKey: values.yaml
  values:
    metrics:
      enabled: true
