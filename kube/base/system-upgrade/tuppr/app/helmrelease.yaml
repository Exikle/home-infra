---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  chartRef:
    kind: OCIRepository
    name: tuppr
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: tuppr-values
      optional: true
      valuesKey: values.yaml
  values:
    controller:
      logLevel: info
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
