---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alertmanager
spec:
  chartRef:
    kind: OCIRepository
    name: alertmanager
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: alertmanager-values
      optional: true
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534

    controllers:
      app:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: quay.io/prometheus/alertmanager
              tag: v0.35.1@sha256:03d4e362b9948eee910802ddac55f9175b320862a2de1fdef5206c3213875a09
            args:
              - --config.file=/etc/alertmanager/alertmanager.yaml
              - --storage.path=/alertmanager
            probes:
              liveness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /-/healthy
                    port: 9093
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /-/ready
                    port: 9093
                  initialDelaySeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    persistence:
      config:
        type: configMap
        name: alertmanager-config
        globalMounts:
          - path: /etc/alertmanager
      data:
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /alertmanager
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    service:
      app:
        ports:
          http:
            port: 9093
